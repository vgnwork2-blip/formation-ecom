le tient en une phrase précise ; (2) la promesse est concrète et vérifiable ; (3) le budget total est chiffré et inférieur ou égal à ce que vous acceptez de perdre ; (4) un seuil d'arrêt et un seuil de réussite sont chiffrés ; (5) un tableau de suivi quotidien est prêt ; (6) la date de lancement est fixée dans les 48 h.\n"}, {"n": 14, "title": "Suivre trafic, taux de conversion et panier moyen", "kind": "lesson", "min": 35, "md": "> Lire un tableau de bord simple, repérer ce qui bloque les ventes et prioriser les corrections.\n\n## Objectifs pratiques\n\nDans cette leçon, vous apprenez à lire un tableau de bord e-commerce minimal avec trois chiffres : le trafic, le taux de conversion et le panier moyen. Vous saurez aussi repérer l'endroit où les ventes se bloquent et choisir une seule correction à faire en priorité. C'est ce qui vous permet de piloter la boutique avec des chiffres et non à l'intuition. Cela prépare aussi votre portfolio de preuves (tableau de bord) et votre plan à 90 jours.\n\n## Pourquoi c'est utile pour votre objectif\n\nVous avez peu de temps (20 minutes par jour) et un budget limité. Sans indicateurs, vous risquez de dépenser en publicité alors que le vrai problème est une fiche produit faible. Avec trois chiffres, vous savez s'il faut chercher plus de visiteurs, mieux convaincre ceux qui viennent, ou augmenter la valeur de chaque commande.\n\n## Les 3 indicateurs à connaître\n\n- **Trafic :** nombre de visiteurs (ou sessions) sur une période. Notez aussi la source (Instagram, TikTok, recherche, publicité, direct).\n- **Taux de conversion :** commandes ÷ sessions × 100. Pour une boutique débutante, un résultat de 1 à 3 % est un repère courant, mais il varie selon la niche, le prix et la qualité du trafic. Comparez-vous d'abord à vous-même, semaine après semaine.\n- **Panier moyen :** chiffre d'affaires ÷ nombre de commandes. Il se compare à votre marge : un panier de 30 € avec 6 € de marge ne laisse pas de place à une pub coûteuse.\n\nLe chiffre d'affaires se résume ainsi : sessions × taux de conversion × panier moyen. Chaque levier agit sur une partie de cette formule.\n\n## Méthode pas à pas\n\n1. Créez un tableau simple (tableur) avec une ligne par semaine et les colonnes : sessions, ajouts au panier, débuts de paiement, commandes, chiffre d'affaires, panier moyen, taux de conversion.\n2. Relevez les données dans l'outil de statistiques de votre plateforme (Shopify, WooCommerce, etc.) ou dans Google Analytics, une fois par jour en 5 minutes ou une fois par semaine pour l'analyse.\n3. Calculez les ratios : conversion globale, puis étape par étape (visite → fiche produit → panier → paiement → commande).\n4. Repérez la fuite principale : où perdez-vous le plus de visiteurs ?\n   - Peu de visiteurs : problème d'acquisition.\n   - Beaucoup de visites mais peu d'ajouts au panier : problème de fiche produit, de prix ou de ciblage.\n   - Beaucoup de paniers mais peu de paiements : frais de livraison surprise, manque de confiance, moyens de paiement insuffisants.\n5. Choisissez une seule correction selon l'impact attendu et l'effort (ex. : afficher la livraison dès la fiche produit).\n6. Changez une chose à la fois, notez la date et la modification, puis attendez assez de visites (au moins quelques centaines de sessions, ou 7 jours) avant de conclure.\n7. Faites un bilan hebdomadaire de 10 minutes : chiffres, hypothèse, décision pour la semaine suivante.\n\n## Exemple concret\n\nUne boutique de bougies artisanales reçoit 600 sessions en une semaine, dont 70 % depuis Instagram. Elle enregistre 6 commandes pour 210 € de chiffre d'affaires. Taux de conversion : 6 ÷ 600 = 1 %. Panier moyen : 210 ÷ 6 = 35 €. Le tableau montre 90 ajouts au panier mais seulement 15 débuts de paiement : la fuite se situe entre le panier et le paiement. La cause probable : les frais de livraison apparaissent trop tard. Correction unique : afficher « livraison 4,90 €, offerte dès 45 € » sur la fiche produit et dans le panier. Effet secondaire possible : le seuil de 45 € pousse le panier moyen à la hausse. On mesure la semaine suivante.\n\n## Erreurs à éviter\n\n- Tirer des conclusions avec trop peu de données (2 commandes ne prouvent rien).\n- Suivre trop d'indicateurs : restez sur trois chiffres et les étapes du tunnel.\n- Modifier plusieurs éléments en même temps : vous ne saurez pas ce qui a marché.\n- Regarder le chiffre d'affaires sans la marge : une vente peut être perdante après frais publicitaires et livraison.\n- Mélanger les sources de trafic : un taux de conversion global cache souvent un canal très bon et un autre mauvais.\n\n## À faire maintenant\n\nCréez votre tableau de bord dans un tableur avec les colonnes de la méthode. Remplissez la première semaine (même avec des zéros ou des données de test), calculez les trois indicateurs, écrivez dans une cellule « fuite principale », « hypothèse » et « correction choisie ». Faites une capture d'écran : ce sera une preuve pour votre portfolio.\n\n## Points clés\n\n- Chiffre d'affaires = sessions × taux de conversion × panier moyen : chaque levier a un rôle distinct.\n- Le taux de conversion se calcule en commandes ÷ sessions ; comparez-vous d'abord à vos propres semaines précédentes.\n- Repérez l'étape du tunnel où les visiteurs disparaissent avant de décider quoi corriger.\n- Une seule modification à la fois, avec date et mesure sur une période suffisante.\n- Le panier moyen doit être lu avec la marge, pas seul.\n\n## Exemples\n\n- Boutique de bougies : 600 sessions, 6 commandes, 210 € de CA → conversion 1 %, panier moyen 35 €. 90 paniers mais 15 paiements engagés : on affiche les frais de livraison dès la fiche produit et un seuil de livraison offerte à 45 €, puis on compare la semaine suivante.\n- Boutique d'accessoires pour animaux : 1 500 sessions, 12 commandes (0,8 %), mais seulement 40 ajouts au panier. Le blocage se situe sur la fiche produit : on améliore les photos, on ajoute 3 arguments clairs et des avis, puis on mesure à nouveau l'ajout au panier après une semaine.\n\n## Exercice\n\nConstruisez un tableau de bord hebdomadaire dans un tableur avec : sessions, source principale, ajouts au panier, débuts de paiement, commandes, chiffre d'affaires, panier moyen et taux de conversion (calculés par formule). Saisissez au moins une semaine de données réelles ou simulées.\n\n**Critères de réussite :** (1) les trois indicateurs sont calculés correctement ; (2) vous avez identifié l'étape du tunnel qui perd le plus de visiteurs ; (3) vous avez écrit une hypothèse et une seule correction prioritaire avec une date de mesure ; (4) une capture du tableau est enregistrée dans votre portfolio.\n"}, {"n": 15, "title": "Mettre en place sa routine de 20 minutes et son tableau de bord", "kind": "exercice", "min": 40, "md": "> Construire un planning quotidien et un tableau de suivi hebdomadaire des indicateurs clés.\n\n## Objectif pratique\n\nDans cet exercice, vous allez construire deux livrables concrets : un planning quotidien de 20 minutes sur 7 jours, et un tableau de bord hebdomadaire qui suit trois indicateurs clés : le trafic, le taux de conversion et le panier moyen. Durée estimée : 45 à 60 minutes pour la mise en place, puis 20 minutes par jour.\n\n## Pourquoi cet exercice vous aide\n\nVotre objectif est de lancer la boutique ce mois-ci, d'obtenir vos premiers visiteurs qualifiés et de décider avec des chiffres plutôt qu'à l'intuition. Un débutant avec 20 minutes par jour n'a pas de temps à perdre. Sans routine, les tâches s'éparpillent. Sans tableau de bord, on ne sait pas si le blocage vient du trafic, de la fiche produit ou du prix. Cet exercice transforme votre plan en habitude tenable et produit les premières preuves visibles de votre gestion de projet.\n\n## Étape 1 : choisir un canal unique (5 min)\n\nChoisissez un seul canal pour 30 jours : réseaux sociaux (Instagram, TikTok, Pinterest), SEO de base ou publicité test avec un petit budget plafonné. Notez en une phrase pourquoi ce canal convient à votre niche et à votre cible. Un seul canal évite la dispersion.\n\n## Étape 2 : construire le planning de 20 minutes (10 min)\n\nCréez un tableau avec 7 lignes (lundi à dimanche) et 4 colonnes : heure fixe, tâche en 20 minutes, livrable du jour, case « fait ». Répartissez par exemple :\n\n- **Lundi :** publier un contenu ou une annonce (5 min de création, 5 min de publication, 10 min d'interaction).\n- **Mardi :** améliorer une fiche produit (titre, photo ou argument).\n- **Mercredi :** prospection ou interactions avec 10 comptes de votre cible.\n- **Jeudi :** contenu n°2 et réponse aux messages.\n- **Vendredi :** relevé des chiffres dans le tableau de bord.\n- **Samedi :** tâche de test (un titre, un visuel ou une offre différente).\n- **Dimanche :** analyse (10 min) et choix de la priorité de la semaine suivante (10 min).\n\nFixez une heure précise et une règle de repli : si vous manquez un jour, vous faites 5 minutes minimum.\n\n## Étape 3 : créer le tableau de bord hebdomadaire (15 min)\n\nUtilisez Google Sheets ou Excel. Colonnes : semaine, visiteurs (depuis Google Analytics, Shopify ou le back-office), commandes, chiffre d'affaires, dépenses publicitaires, taux de conversion (commandes ÷ visiteurs), panier moyen (chiffre d'affaires ÷ commandes), coût d'acquisition (dépenses ÷ commandes), action prioritaire de la semaine. Ajoutez des formules pour les calculs automatiques. Ajoutez une ligne d'objectif par semaine (par exemple 150 visiteurs, 1 % de conversion, 1 à 2 commandes).\n\n## Étape 4 : exemple concret et lecture des chiffres (10 min)\n\nSimulez une semaine : 200 visiteurs, 2 commandes, 90 € de chiffre d'affaires. Conversion = 1 %, panier moyen = 45 €. Règle de diagnostic : trafic faible, donc agir sur le canal ; trafic correct mais conversion inférieure à 1 %, donc corriger fiches produits, photos, confiance et frais de livraison ; conversion correcte mais panier bas, donc proposer lots ou seuil de livraison offerte. Écrivez ces trois règles sous votre tableau.\n\n## Erreurs à éviter\n\n- Multiplier les canaux dès la première semaine.\n- Suivre trop d'indicateurs : restez sur trois à cinq chiffres.\n- Augmenter le budget publicitaire avant d'avoir au moins 100 visiteurs et une conversion mesurée.\n- Modifier dix choses à la fois, ce qui empêche de savoir ce qui a marché.\n- Ne pas remplir le tableau parce que les chiffres sont à zéro : un zéro est une information.\n\n## Livrables attendus et critères de réussite\n\n- Un planning de 7 jours complet avec heure fixe et livrable quotidien.\n- Un tableau de bord avec formules fonctionnelles et objectifs chiffrés.\n- Une capture d'écran des deux documents et de la première semaine renseignée.\n- Trois règles de décision écrites.\n\n**Critère de réussite :** un tiers pourrait lire votre tableau et dire quelle action corriger en priorité.\n\n## Action immédiate\n\nAujourd'hui, créez le fichier, renseignez le planning et programmez un rappel quotidien. Demain, exécutez la tâche du jour et notez vos premiers chiffres.\n\n## Points clés\n\n- Un seul canal d'acquisition pendant 30 jours pour rester concentré\n- Une routine de 20 minutes à heure fixe avec un livrable par jour\n- Trois indicateurs clés : trafic, taux de conversion, panier moyen\n- Taux de conversion = commandes ÷ visiteurs ; panier moyen = chiffre d'affaires ÷ commandes\n- Règles de décision : trafic faible, conversion faible ou panier faible orientent la priorité\n- Ne modifier qu'un élément à la fois pour mesurer l'effet\n- Les captures d'écran du tableau de bord servent de preuves pour le portfolio\n\n## Exemples\n\n- Semaine type : 200 visiteurs, 2 commandes, 90 € de chiffre d'affaires, soit 1 % de conversion et 45 € de panier moyen. Le trafic est correct, donc la priorité est le panier moyen avec un lot à 2 produits.\n- Ligne de planning : Mardi, 19h00, réécrire le titre et les 3 arguments de la fiche produit n°1, livrable : fiche mise à jour en ligne.\n- Règle de décision : si moins de 100 visiteurs en une semaine, aucune dépense publicitaire supplémentaire, on renforce le contenu organique.\n\n## Exercice\n\nCréez un planning de 7 jours à 20 minutes par jour et un tableau de bord hebdomadaire (visiteurs, commandes, chiffre d'affaires, dépenses, taux de conversion, panier moyen, coût d'acquisition, action prioritaire) avec formules et objectifs chiffrés. Renseignez une semaine (réelle ou simulée) et rédigez trois règles de décision. Livrez des captures d'écran des deux documents ; le critère de réussite est que l'action prioritaire de la semaine suivante se déduise clairement des chiffres.\n"}, {"n": 16, "title": "Acquisition et indicateurs clés", "kind": "quiz", "min": 0, "sub": "Tester la capacité à diagnostiquer un problème de trafic ou de conversion.", "questions": [{"q": "Pourquoi est-il recommandé de choisir un seul canal d'acquisition pendant au moins 14 jours quand on débute ?", "o": ["Parce que les autres canaux sont toujours plus chers", "Pour obtenir des données exploitables sans dispersion et pouvoir lire ses indicateurs", "Parce qu'une boutique ne peut pas être présente sur plusieurs réseaux sociaux", "Pour être sûr de réaliser une vente dès la première semaine"], "a": 1}, {"q": "Votre boutique doit obtenir sa première vente ce mois-ci. Pourquoi le SEO de base n'est-il pas le canal principal à privilégier ?", "o": ["Parce qu'il est interdit pour les boutiques débutantes", "Parce qu'il coûte plus cher que la publicité", "Parce que ses résultats arrivent plutôt en 3 à 6 mois, il se prépare en parallèle sans être le canal principal", "Parce qu'il ne fonctionne que pour les produits visuels"], "a": 2}, {"q": "Quels éléments doivent être définis AVANT de lancer un test d'acquisition à petit budget ?", "o": ["Uniquement le visuel de l'annonce", "Une cible, un message, un budget plafonné et un critère d'arrêt écrit", "Le budget définitif de toute l'année et le nombre de ventes attendu", "Cinq variantes d'annonces pour tester un maximum d'idées"], "a": 1}, {"q": "Une boutique reçoit beaucoup de visiteurs mais très peu d'ajouts au panier. Selon la méthode de lecture du tunnel, où se situe le problème le plus probable ?", "o": ["Dans l'acquisition : il faut chercher encore plus de visiteurs", "Dans la fiche produit, le prix ou le ciblage", "Dans les moyens de paiement uniquement", "Dans le calcul du panier moyen"], "a": 1}, {"q": "Une boutique a eu 800 sessions et 16 commandes pour 640 € de chiffre d'affaires sur une semaine. Quels sont son taux de conversion et son panier moyen ?", "o": ["Taux de conversion de 2 % et panier moyen de 40 €", "Taux de conversion de 5 % et panier moyen de 40 €", "Taux de conversion de 2 % et panier moyen de 80 €", "Taux de conversion de 0,5 % et panier moyen de 20 €"], "a": 0}]}, {"n": 17, "title": "Construire un portfolio de preuves e-commerce", "kind": "lesson", "min": 20, "md": "> Capturer boutique, première vente et tableau de bord pour démontrer une gestion de projet de bout en bout.\n\n## Objectifs pratiques\n\nDans cette leçon, vous allez construire un portfolio de preuves e-commerce en 20 minutes par jour : captures de la boutique, de la première vente et du tableau de bord, regroupées dans un document unique. Ce portfolio rend visible votre capacité à mener un projet de bout en bout. C'est l'objectif 9 de votre parcours. Il prépare aussi le plan à 90 jours.\n\n## Pourquoi c'est utile pour votre objectif\n\nVous avez une motivation business et une échéance ce mois-ci. Un portfolio de preuves sert à trois choses :\n\n- Rassurer des partenaires, fournisseurs, banquiers ou futurs clients.\n- Mesurer votre progression avec des chiffres datés plutôt qu'au ressenti.\n- Décider quoi corriger ou quand investir, grâce à un historique fiable.\n\nUne preuve = un fait vérifiable, daté et lisible en 10 secondes.\n\n## Méthode pas à pas\n\n1. Créez un dossier unique (Drive ou Notion) nommé « Preuves boutique » avec 4 sous-dossiers : Boutique, Ventes, Chiffres, Apprentissages.\n2. Capturez la boutique : page d'accueil, une fiche produit complète, panier, page de paiement sécurisé (cadenas visible), mentions légales, CGV. Ajoutez la date et l'URL dans le nom du fichier (ex. 2026-10-12_fiche-produit.png).\n3. Capturez la première vente : notification de commande, montant, produit, date. Masquez les données personnelles du client (nom, adresse, email). Si pas encore de vente, gardez une commande test et le message « objectif : 1 vente avant le [date] ».\n4. Capturez le tableau de bord : visiteurs, taux de conversion, panier moyen, marge. Prenez une capture par semaine, toujours sur la même période pour comparer.\n5. Ajoutez une légende de 2 lignes par preuve : ce que montre l'image, ce que vous avez décidé ensuite.\n6. Assemblez une page de synthèse : lien de la boutique, 5 à 8 captures, 3 chiffres clés, 3 leçons apprises, 1 objectif suivant.\n7. Mettez à jour chaque semaine : 10 minutes le dimanche suffisent.\n\n## Exemple concret\n\nBoutique de bougies artisanales, lancée le 5 du mois. Le portfolio contient : la fiche produit (photo, bénéfices, avis), la capture du paiement sécurisé, la première commande de 32 € (marge 14 €), et le tableau de bord de la semaine 1 : 240 visiteurs, 2 commandes, taux de conversion 0,8 %, panier moyen 32 €. Légende : « Conversion faible, je retravaille les photos et ajoute la livraison offerte dès 40 € ». La semaine 2 montre l'effet : 1,3 % et panier moyen à 41 €.\n\n## Erreurs à éviter\n\n- Publier des données clients personnelles : toujours flouter.\n- Captures sans date ni contexte : elles ne prouvent rien.\n- Ne montrer que le chiffre d'affaires : montrez aussi marge et dépenses, sinon le portfolio manque de crédibilité.\n- Embellir ou inventer des résultats : restez factuel, un échec analysé vaut une preuve.\n- Attendre la perfection : commencez dès aujourd'hui avec ce que vous avez.\n\n## À faire maintenant\n\nCréez le dossier, réalisez au moins 5 captures datées (accueil, fiche produit, paiement, mentions légales, tableau de bord) et rédigez la page de synthèse d'une page avec 3 chiffres et 1 objectif pour la semaine suivante.\n\n## Points clés\n\n- Une preuve doit être datée, vérifiable et compréhensible en 10 secondes\n- Capturer trois piliers : boutique, première vente, tableau de bord\n- Protéger les données personnelles des clients avant toute publication\n- Ajouter à chaque capture une légende expliquant la décision prise\n- Mettre à jour le portfolio chaque semaine en 10 minutes\n\n## Exemples\n\n- Boutique de bougies : première commande de 32 € avec marge de 14 €, tableau de bord semaine 1 (240 visiteurs, 2 commandes, conversion 0,8 %), puis semaine 2 à 1,3 % après amélioration des photos et seuil de livraison offerte à 40 €.\n- Boutique d'accessoires pour animaux sans vente au bout de 10 jours : le portfolio montre la boutique complète, 180 visiteurs, 0 vente, l'analyse (prix trop élevé face à la concurrence) et le test prévu (offre de lancement -10 %). La démarche prouve la rigueur de gestion même sans vente.\n\n## Exercice\n\nConstituez votre dossier « Preuves boutique » avec : 5 captures minimum datées et nommées clairement (accueil, fiche produit, paiement sécurisé, mentions légales, tableau de bord), la capture de la première vente ou de la commande test avec données client floutées, et une page de synthèse.\n\n**Critères de réussite :** chaque capture a une légende de 2 lignes, la synthèse contient l'URL, 3 chiffres clés (visiteurs, conversion, panier moyen), 3 leçons apprises et 1 objectif mesurable pour les 7 prochains jours, et rien ne révèle d'information personnelle de client.\n"}, {"n": 18, "title": "Planifier les 90 jours suivant le lancement", "kind": "lesson", "min": 20, "md": "> Fixer des objectifs mesurables, arbitrer entre investir et attendre, décider de l'échelle à viser.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon, vous aurez un plan de 90 jours chiffré pour votre boutique : trois paliers mesurables, des règles claires pour décider d'investir ou d'attendre, et un seuil qui vous dit s'il faut passer à l'échelle. Avec 20 minutes par jour, ce plan transforme votre lancement en projet piloté. Il devient aussi une preuve visible de votre capacité à gérer un projet e-commerce de bout en bout.\n\n## Pourquoi c'est utile pour votre objectif\n\nUne boutique lancée sans plan se dilue : on change de produit, on dépense en publicité sans mesure, on abandonne au bout de trois semaines. Un plan à 90 jours relie les modules précédents (niche, boutique, fiches produits, marges, acquisition, indicateurs) à des objectifs datés. Il montre aussi à un futur partenaire, fournisseur ou client que vous raisonnez avec des chiffres.\n\n## Méthode pas à pas\n\n1. **Relevez votre point de départ.** Notez le trafic hebdomadaire, le taux de conversion, le panier moyen, la marge unitaire et le budget disponible. Si vous n'avez pas encore de ventes, écrivez 0 : c'est votre base.\n2. **Découpez en trois phases de 30 jours.**\n   - Jours 1-30 : valider. Objectif : les premières ventes réelles et un canal d'acquisition testé.\n   - Jours 31-60 : optimiser. Objectif : améliorer la conversion et les fiches produits.\n   - Jours 61-90 : décider. Objectif : consolider ce qui marche et choisir l'échelle.\n3. **Fixez 1 à 3 objectifs mesurables par phase.** Utilisez le format « indicateur + valeur + date ». Exemple : « 10 commandes au jour 30 », « taux de conversion à 1,5 % au jour 60 ».\n4. **Calculez le budget et le seuil de rentabilité.** Seuil = charges fixes mensuelles ÷ marge unitaire. Avec 60 € de charges et 12 € de marge par commande, il faut 5 commandes pour ne pas perdre d'argent.\n5. **Écrivez vos règles d'arbitrage « investir ou attendre ».** Exemples :\n   - Investir davantage en publicité seulement si le coût d'acquisition est inférieur à 50 % de la marge unitaire sur au moins 20 clics qualifiés.\n   - Réapprovisionner seulement après 3 ventes du même produit, avec un petit lot.\n   - Attendre si la conversion reste sous 0,5 % : corriger d'abord la fiche produit.\n6. **Définissez les seuils de décision au jour 90.**\n   - Arrêter ou pivoter : marge nette négative et aucune progression.\n   - Maintenir : rentabilité proche de l'équilibre.\n   - Passer à l'échelle : marge positive, acquisition reproductible, stock maîtrisé.\n7. **Intégrez la routine de 20 minutes.** Chaque jour : 5 min pour lire les chiffres, 10 min pour l'action prioritaire, 5 min pour noter le résultat. Chaque semaine : une revue de 20 minutes.\n8. **Archivez vos preuves.** Captures du tableau de bord, première commande (données personnelles masquées), avant/après d'une fiche produit.\n\n## Exemple concret\n\nUne boutique d'accessoires de cuisine écoresponsables vend un produit à 24 €. Coût d'achat 8 €, livraison et emballage 4 €, frais de paiement 1 €. La marge unitaire est de 11 €. Les charges fixes sont de 55 € par mois (abonnement boutique et domaine), donc le seuil est de 5 commandes.\n\n- **Jours 1-30 :** 8 commandes via un réseau social, avec 60 € de publicité test. La marge brute est de 88 €, moins 55 € et 60 €, soit environ -27 €. C'est acceptable pour une phase de test.\n- **Jours 31-60 :** on améliore photos et arguments, et la conversion passe de 0,8 % à 1,4 %.\n- **Jours 61-90 :** le coût d'acquisition passe sous 5 €, soit moins de 50 % de la marge. La règle autorise alors de doubler le budget et de commander un second lot.\n\n## Erreurs à éviter\n\n- Fixer des objectifs vagues (« avoir plus de ventes ») sans valeur ni date.\n- Viser l'échelle avant d'avoir un canal reproductible.\n- Doubler le budget publicitaire ou le stock sur la foi d'une seule bonne journée.\n- Oublier les frais de paiement, de retour et de livraison dans le calcul du seuil.\n- Changer de niche chaque semaine : laissez au moins 30 jours de données à chaque test.\n\n## À faire maintenant\n\nRédigez votre plan à 90 jours sous forme de tableau : 3 phases, 1 à 3 objectifs chiffrés par phase, budget maximum, seuil de rentabilité, et 3 règles « investir ou attendre ». Ajoutez la décision prévue au jour 90 (pivoter, maintenir ou passer à l'échelle) et planifiez votre revue hebdomadaire de 20 minutes.\n\n## Points clés\n\n- Un objectif mesurable se formule ainsi : indicateur + valeur + date.\n- Trois phases de 30 jours : valider, optimiser, décider.\n- Seuil de rentabilité = charges fixes ÷ marge unitaire.\n- Des règles « investir ou attendre » écrites à l'avance évitent les décisions émotionnelles.\n- Le tableau de bord et le plan constituent des preuves pour votre portfolio.\n\n## Exemples\n\n- Boutique d'accessoires de cuisine à 24 € : marge unitaire de 11 €, charges fixes de 55 €, seuil de 5 commandes. Un budget test de 60 € produit 8 commandes au jour 30, ce qui donne une perte contrôlée d'environ 27 €.\n- Règle d'arbitrage : le budget publicitaire n'est doublé que si le coût d'acquisition reste sous 50 % de la marge unitaire après 20 clics qualifiés. Si la conversion est sous 0,5 %, on corrige d'abord la fiche produit au lieu de dépenser plus.\n\n## Exercice\n\nCréez un tableau de plan à 90 jours avec : (1) un point de départ chiffré ; (2) 3 phases de 30 jours avec 1 à 3 objectifs au format indicateur + valeur + date ; (3) le budget maximum et le seuil de rentabilité calculé ; (4) 3 règles « investir ou attendre » ; (5) les seuils de décision au jour 90.\n\n**Critères de réussite :** tous les objectifs sont chiffrés et datés, le calcul du seuil est juste, les règles sont vérifiables avec vos indicateurs, et une revue hebdomadaire de 20 minutes est planifiée.\n"}, {"n": 19, "title": "Rédiger son plan d'action à 90 jours", "kind": "exercice", "min": 20, "md": "> Transformer les résultats du premier mois en objectifs chiffrés et en priorités hebdomadaires.\n\n## Pourquoi cet exercice compte\n\nVotre boutique est lancée ou presque. Le risque du deuxième mois est de continuer sans cap : on bricole, on dépense en publicité sans mesurer et on abandonne. Un plan à 90 jours chiffré transforme vos premiers résultats en décisions : quoi corriger en priorité, quand investir, quand attendre. Il sert aussi de preuve visible de votre capacité à piloter un projet e-commerce de bout en bout, et il tient dans 20 minutes par jour grâce à des priorités hebdomadaires claires.\n\n**Durée estimée :** 3 sessions de 20 minutes, soit environ 1 heure. **Livrable :** un document d'une à deux pages (Google Docs, Notion ou tableur) intitulé « Plan d'action 90 jours ».\n\n## Étape 1 : établir le point de départ (20 min)\n\nRassemblez vos chiffres réels du premier mois. Si vous n'avez pas encore de ventes, notez 0 et utilisez des estimations prudentes, clairement identifiées comme telles. Remplissez ce tableau :\n\n- Visiteurs uniques du mois\n- Taux de conversion (commandes ÷ visiteurs)\n- Panier moyen (€)\n- Marge brute par commande (prix de vente − coût produit − livraison − frais de paiement)\n- Dépenses totales (outils, publicité, stock, échantillons)\n- Seuil de rentabilité en nombre de commandes (charges fixes mensuelles ÷ marge par commande)\n- Canal d'acquisition principal et nombre de visiteurs qu'il a apporté\n\nIdentifiez ensuite le goulot d'étranglement principal : trafic insuffisant (moins de 300 visiteurs/mois), conversion faible (moins de 1 %), panier trop bas, ou marge trop mince.\n\n## Étape 2 : fixer 3 objectifs chiffrés par palier (20 min)\n\nDéfinissez des objectifs pour le jour 30, le jour 60 et le jour 90. Chaque objectif doit respecter le format : indicateur, valeur de départ, valeur cible, date. Exemple : « Passer de 120 à 400 visiteurs qualifiés par mois d'ici le jour 30 via 12 publications TikTok ». Limitez-vous à un objectif de trafic, un de conversion ou de panier moyen, et un de rentabilité. Ajoutez un seuil de décision : « Si le coût d'acquisition dépasse 40 % de la marge, je stoppe la publicité test ».\n\n## Étape 3 : planifier 12 semaines en priorités (20 min)\n\nPour chaque semaine, indiquez UNE priorité principale et 3 à 5 micro-tâches de 20 minutes maximum (ex. : réécrire 2 fiches produits, ajouter 3 photos, publier 3 contenus, relire le tableau de bord le dimanche). Prévoyez une revue hebdomadaire de 20 minutes et une revue de palier aux jours 30, 60 et 90. Ajoutez une règle d'arbitrage investir ou attendre : n'augmentez le budget ou le stock que si la marge est positive sur au moins 10 commandes.\n\n## Étape 4 : anticiper les erreurs (inclus dans la session 3)\n\nListez 4 risques (fournisseur peu fiable, stock excessif, promesses floues, dépenses publicitaires aveugles) avec pour chacun une parade concrète et un plafond de dépense.\n\n## Critères de réussite\n\n- Point de départ chiffré avec au moins 6 indicateurs\n- 3 objectifs par palier, tous mesurables et datés\n- 12 semaines, chacune avec une priorité et des tâches de 20 minutes maximum\n- Au moins 3 seuils de décision écrits\n- Risques et plafonds de dépense définis\n- Document partageable, daté, prêt à être ajouté à votre portfolio\n\n## Erreurs à éviter\n\nFixer des objectifs vagues (« plus de ventes »), copier des chiffres de gourous sans lien avec vos données, planifier plus de 20 minutes par jour, et multiplier les canaux d'acquisition au lieu d'en maîtriser un seul.\n\n## Points clés\n\n- Un plan à 90 jours part des chiffres réels du premier mois, pas de l'intuition\n- Chaque objectif = indicateur + valeur de départ + cible + date\n- Une seule priorité principale par semaine, des tâches de 20 minutes maximum\n- Des seuils de décision écrits évitent les dépenses aveugles et les stocks excessifs\n- Le document devient une preuve visible pour le portfolio\n\n## Exemples\n\n- Objectif jour 30 : passer de 120 à 400 visiteurs via 12 contenus sociaux, mesuré dans Google Analytics.\n- Objectif jour 60 : taux de conversion de 0,8 % à 1,5 % en réécrivant 5 fiches produits et en ajoutant des avis clients.\n- Seuil de décision : n'augmenter le stock qu'après 10 commandes avec une marge nette positive.\n- Semaine 3 : priorité = photos produits ; tâches = 2 photos/jour, retouche, mise en ligne, test mobile.\n\n## Exercice\n\nRédigez un document « Plan d'action 90 jours » d'une à deux pages : tableau de départ avec au moins 6 indicateurs chiffrés, 3 objectifs mesurables aux jours 30, 60 et 90, un calendrier de 12 semaines avec une priorité et des tâches de 20 minutes maximum par semaine, puis au moins 3 seuils de décision et 4 risques avec parades. Partagez-le via un lien consultable et ajoutez-le à votre portfolio.\n"}, {"n": 20, "title": "Arbitrages et croissance", "kind": "quiz", "min": 0, "sub": "Vérifier les réflexes de décision : quand investir, corriger ou attendre.", "questions": [{"q": "Une boutique a 60 € de charges fixes mensuelles et dégage 12 € de marge par commande. Quel est son seuil de rentabilité ?", "o": ["3 commandes", "5 commandes", "12 commandes", "60 commandes"], "a": 1}, {"q": "Selon la méthode du plan à 90 jours, quelle formulation correspond à un objectif mesurable valide ?", "o": ["Améliorer la conversion dès que possible", "Atteindre un taux de conversion de 1,5 % au jour 60", "Travailler davantage sur les fiches produits", "Obtenir beaucoup de visiteurs ce mois-ci"], "a": 1}, {"q": "Votre taux de conversion reste sous 0,5 % alors que le trafic augmente. Quelle règle d'arbitrage « investir ou attendre » s'applique ?", "o": ["Augmenter immédiatement le budget publicitaire pour compenser", "Commander un gros stock pour proposer une livraison plus rapide", "Attendre et corriger d'abord la fiche produit avant d'investir davantage", "Changer de niche sans analyser les chiffres"], "a": 2}, {"q": "Pour le portfolio de preuves, vous capturez votre première vente. Quelle précaution devez-vous prendre avant de la publier ?", "o": ["Ajouter le nom et l'adresse du client pour prouver que la vente est réelle", "Masquer les données personnelles du client (nom, adresse, email)", "Supprimer la date pour que la capture reste valable longtemps", "Remplacer le montant par une valeur arrondie"], "a": 1}, {"q": "Dans le plan à 90 jours, quel est l'objectif de la phase des jours 31 à 60 ?", "o": ["Valider les premières ventes et tester un canal d'acquisition", "Optimiser la conversion et les fiches produits", "Décider de pivoter, maintenir ou passer à l'échelle", "Choisir la niche et le fournisseur"], "a": 1}]}, {"n": 21, "title": "Boutique lancée, preuves et plan à 90 jours", "kind": "projet", "min": 20, "md": "> Livrer une boutique en ligne fonctionnelle, un tableau de bord et un plan de croissance sur 90 jours.\n\n## Objectif du projet\n\nCe projet final te fait livrer, de bout en bout, une mini-entreprise e-commerce réelle : une niche validée, une boutique en ligne fonctionnelle et prête à encaisser, un premier canal d'acquisition, un tableau de bord chiffré et un plan de croissance à 90 jours. Il rassemble tout le parcours (niche, boutique, fiches produits, calculs de marge, acquisition, indicateurs, routine de 20 minutes par jour, erreurs à éviter). Il sert aussi de portfolio de preuves visible, que tu pourras montrer à un futur partenaire, un fournisseur, un client ou un investisseur.\n\n## Pourquoi ce projet te sert\n\nTon but est de lancer un business ce mois-ci avec un budget maîtrisé. Le projet transforme chaque leçon en actif réutilisable : une étude de niche, une boutique, des fiches produits modèles, un fichier de calcul des marges, un tableau de bord et une feuille de route. Il te montre où tu perds des ventes et quand investir ou attendre. Avec 20 minutes par jour, la clé est de découper le travail en micro-tâches.\n\n## Étapes à suivre\n\n### Étape 1 : valider la niche (jours 1 à 4)\n\nListe 5 niches possibles. Pour chacune, note la demande (recherches Google Trends, suggestions de recherche, volume sur les réseaux), la concurrence (5 boutiques concurrentes, leurs prix, leurs avis, leurs points faibles) et la marge potentielle. Choisis une niche et un produit de départ (3 produits maximum) avec un tableau de décision noté sur 20. Ne dépense rien tant que la niche n'est pas validée.\n\n### Étape 2 : choisir le fournisseur et calculer les chiffres (jours 5 à 8)\n\nCompare au moins 2 fournisseurs (délais, qualité, coût de livraison, politique de retour). Commande un échantillon si possible. Dans un tableur, calcule : coût d'achat, frais de livraison, frais de paiement, TVA, prix de vente, marge brute et nette, coût d'acquisition maximal et seuil de rentabilité (nombre de ventes pour couvrir tes frais fixes). Évite le stock excessif : commence petit ou en dropshipping/précommande transparente.\n\n### Étape 3 : monter la boutique (jours 9 à 16)\n\nCrée la boutique sur une plateforme adaptée aux débutants (Shopify, WooCommerce, PrestaShop ou équivalent). Configure : pages produits, page d'accueil claire, paiement sécurisé (Stripe, PayPal ou équivalent, HTTPS), zones et tarifs de livraison, mentions légales, CGV, politique de confidentialité, politique de retour et de rétractation (14 jours en UE), cookies. Fais une commande test de bout en bout.\n\n### Étape 4 : rédiger des fiches produits persuasives (jours 12 à 18)\n\nPour chaque produit : titre clair, bénéfice principal, 3 à 5 arguments, caractéristiques, photos nettes (fond propre, angles multiples, mise en situation), réponse aux objections (taille, délai, retour), preuves (avis, garantie). Évite les promesses floues ou exagérées.\n\n### Étape 5 : premier canal d'acquisition (jours 17 à 24)\n\nChoisis un seul canal : réseaux sociaux (contenu court régulier), SEO de base (titres, descriptions, 5 mots-clés) ou publicité test avec un budget plafonné fixé à l'avance. Pose des liens suivis (UTM) et installe un outil de mesure (Google Analytics ou statistiques de la plateforme). Ne lance pas de publicité sans avoir suivi la conversion.\n\n### Étape 6 : tableau de bord et diagnostic (jours 22 à 28)\n\nSuis chaque semaine : visiteurs, taux de conversion, panier moyen, coût d'acquisition, ventes, marge. Identifie le goulot d'étranglement (trafic, fiche produit, confiance, prix, paiement) et choisis UNE correction prioritaire.\n\n### Étape 7 : portfolio et plan à 90 jours (jours 28 à 30)\n\nRassemble les preuves : captures de la boutique, fiches produits, tableau de bord, première vente ou commande test, étude de niche. Rédige un plan à 90 jours en 3 phases de 30 jours avec objectifs mesurables et règles de décision (investir, attendre, arrêter).\n\n## Livrables\n\n- Étude de niche (1 à 2 pages) et tableau de décision.\n- Tableur de calcul des prix, marges et seuil de rentabilité.\n- Boutique en ligne accessible par URL, avec paiement, livraison et pages légales.\n- Au moins 3 fiches produits complètes.\n- Plan d'acquisition du canal choisi et premiers résultats.\n- Tableau de bord des indicateurs avec analyse.\n- Dossier portfolio de preuves (PDF ou page Notion).\n- Plan à 90 jours avec objectifs chiffrés.\n\n## Grille d'évaluation (100 points)\n\n- Niche et analyse de marché : 15 points\n- Calculs financiers fiables : 15 points\n- Boutique fonctionnelle et conforme : 20 points\n- Qualité des fiches produits : 15 points\n- Acquisition et mesure : 10 points\n- Tableau de bord et analyse : 10 points\n- Portfolio de preuves : 5 points\n- Plan à 90 jours : 10 points\n\n## Conseils\n\nBloque 20 minutes à heure fixe chaque jour et termine chaque session par la tâche du lendemain. Privilégie « livré » à « parfait ». Documente tout au fil de l'eau avec des captures datées. Fixe un budget maximal de test et une règle d'arrêt avant de dépenser. Vérifie les obligations légales de ton pays (TVA, statut d'entrepreneur, informations légales) auprès d'une source officielle.\n\n## Points clés\n\n- Valider la niche avec des données avant toute dépense\n- Calculer marge et seuil de rentabilité avant de fixer les prix\n- Boutique prête : paiement sécurisé, livraison, mentions légales, commande test\n- Un seul canal d'acquisition testé avec un budget plafonné et suivi\n- Tableau de bord hebdomadaire pour décider la correction prioritaire\n- Portfolio de preuves et plan à 90 jours avec objectifs mesurables\n- Routine de 20 minutes par jour découpée en micro-tâches\n\n## Exemples\n\n- Niche : accessoires de rangement pour petits espaces ; 3 produits, marge nette cible 35 %, seuil de rentabilité de 18 ventes par mois.\n- Fiche produit : bénéfice en titre, 4 arguments, 6 photos, FAQ livraison/retour et garantie visible.\n- Plan à 90 jours : J1-30 premières 10 ventes ; J31-60 conversion de 1 % à 1,8 % ; J61-90 décision d'échelle selon marge et coût d'acquisition.\n- Règle de décision : si 300 visiteurs sans vente, corriger la fiche produit avant d'augmenter la publicité.\n\n## Exercice\n\nLivre le dossier complet (URL de la boutique, étude de niche, tableur de marges, 3 fiches produits, plan d'acquisition, tableau de bord avec au moins 2 semaines de données ou une simulation clairement indiquée, portfolio de preuves, plan à 90 jours).\n\n**Critères :** boutique fonctionnelle et conforme (commande test réussie), chiffres cohérents et vérifiables, fiches claires et sans promesses floues, analyse qui débouche sur une action prioritaire, objectifs à 90 jours mesurables et datés. Note finale sur 100 selon la grille ; seuil de réussite : 70 points.\n"}]};

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
}

/* Rendu du texte des leçons */
function renderBody(md) {
  const lines = md.split("\n");
  let sub = "";
  const secs = [];
  let cur = { title: "", html: "" };
  let para = [];
  let list = null;
  const flushPara = () => { if (para.length) { cur.html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const flushList = () => {
    if (!list) return;
    const tag = list.type;
    cur.html += "<" + tag + ">" + list.items.map(it =>
      "<li>" + inline(it.t) + (it.sub.length ? "<ul>" + it.sub.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>" : "") + "</li>").join("") + "</" + tag + ">";
    list = null;
  };
  const pushSec = () => { flushPara(); flushList(); if (cur.title || cur.html) secs.push(cur); };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (line.startsWith("> ")) { sub = line.slice(2); continue; }
    if (line.startsWith("## ")) { pushSec(); cur = { title: line.slice(3), html: "" }; continue; }
    if (line.startsWith("### ")) { flushPara(); flushList(); cur.html += "<h3>" + inline(line.slice(4)) + "</h3>"; continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    const m = line.match(/^(\s*)(-|\d+\.)\s+(.*)$/);
    if (m) {
      flushPara();
      const indent = m[1].length;
      const type = m[2] === "-" ? "ul" : "ol";
      if (indent > 0 && list && list.items.length) { list.items[list.items.length - 1].sub.push(m[3]); }
      else {
        if (list && list.type !== type) flushList();
        if (!list) list = { type, items: [] };
        list.items.push({ t: m[3], sub: [] });
      }
      continue;
    }
    flushList();
    para.push(line.trim());
  }
  pushSec();
  const cls = t => {
    const x = t.toLowerCase();
    if (x.includes("à faire maintenant") || x === "exercice" || x.includes("action immédiate")) return "task";
    if (x.includes("points clés")) return "key";
    if (x.includes("erreurs")) return "pitfalls";
    if (x.includes("livrables") || x.includes("critères")) return "check";
    if (x.startsWith("exemple")) return "example";
    return "";
  };
  const html = secs.map(s => '<section class="sec ' + cls(s.title) + '">' + (s.title ? "<h2>" + inline(s.title) + "</h2>" : "") + s.html + "</section>").join("");
  return { sub, html };
}

const KIND = { lesson: "Leçon", exercice: "Exercice", quiz: "Quiz", projet: "Projet final" };
const lessonByN = n => LESSONS[n - 1];
const modOf = n => MODS.find(m => n >= m.from && n <= m.to);

function go(n, opts) {
  n = Math.max(1, Math.min(N + 1, n));
  current = n;
  try { history.replaceState(null, "", n === N + 1 ? "#attestation" : "#l" + n); } catch (e) { try { location.hash = n === N + 1 ? "attestation" : "l" + n; } catch (e2) {} }
  render();
  closeMenu();
  if (!opts || !opts.keep) { window.scrollTo(0, 0); }
}
function fromHash() {
  const h = (location.hash || "").replace("#", "");
  if (h === "attestation") return N + 1;
  const m = h.match(/^l(\d+)$/);
  if (m) { const n = parseInt(m[1], 10); if (n >= 1 && n <= N) return n; }
  for (let i = 1; i <= N; i++) if (!isDone(i)) return i;
  return 1;
}

function renderTrack() {
  $("track").innerHTML = MODS.map(m => {
    const btns = [];
    for (let n = m.from; n <= m.to; n++) {
      const l = lessonByN(n);
      btns.push('<button type="button" data-n="' + n + '" class="' + (isDone(n) ? "done " : "") + (n === current ? "cur" : "") + '" aria-label="Leçon ' + n + " : " + esc(l.title) + (isDone(n) ? " (terminée)" : "") + '" title="' + n + ". " + esc(l.title) + '"></button>');
    }
    return '<div class="grp" style="--w:' + (m.to - m.from + 1) + '">' + btns.join("") + "</div>";
  }).join("");
}
function renderToc() {
  let html = "";
  for (const m of MODS) {
    html += "<h2>Module " + m.id + " · " + esc(m.title) + "</h2><ol>";
    for (let n = m.from; n <= m.to; n++) {
      const l = lessonByN(n);
      const cls = isDone(n) ? "done" : (n === current ? "cur" : "");
      html += '<li><button type="button" data-n="' + n + '"' + (n === current ? ' aria-current="page"' : "") + '><span class="dot ' + cls + '"></span><span class="num">' + String(n).padStart(2, "0") + "</span><span>" + esc(l.title) +
        (l.kind === "quiz" ? '<span class="tag quiz">Quiz</span>' : l.kind === "exercice" ? '<span class="tag">Exercice</span>' : l.kind === "projet" ? '<span class="tag">Projet</span>' : "") + "</span></button></li>";
    }
    html += "</ol>";
  }
  html += "<h2>Fin de parcours</h2><ol><li><button type=\"button\" data-n=\"" + (N + 1) + '"' + (current === N + 1 ? ' aria-current="page"' : "") + '><span class="dot ' + (allDone() && state.certDate ? "done" : (current === N + 1 ? "cur" : "")) + '"></span><span class="num">★</span><span>Attestation' + (allDone() ? "" : '<span class="tag">Verrouillée</span>') + "</span></button></li></ol>";
  $("toc").innerHTML = html;
}
function renderChrome() {
  renderTrack(); renderToc();
  $("count").innerHTML = "<b>" + doneCount() + "</b> / " + N + " terminées";
  const prev = $("prev"), next = $("next");
  prev.disabled = current <= 1;
  next.disabled = current >= N + 1;
  $("mid").textContent = current > N ? "Attestation" : current + " / " + N;
}

function render() {
  renderChrome();
  if (current > N) renderCert(); else renderLesson(lessonByN(current));
  const m = $("main"); m.focus({ preventScroll: true });
}

function eyebrowFor(l) {
  const m = modOf(l.n);
  return "Module " + m.id + " · " + KIND[l.kind] + " " + l.n + " sur " + N + (l.min ? " · " + l.min + " min" : "");
}

function renderLesson(l) {
  const body = l.kind === "quiz" ? { sub: l.sub, html: "" } : renderBody(l.md);
  let html = '<div class="eyebrow">' + eyebrowFor(l) + "</div><h1>" + esc(l.title) + '</h1><p class="sub">' + esc(body.sub || l.sub || "") + "</p>";
  html += body.html;
  if (l.kind === "quiz") html += '<div id="quizHost"></div>';
  else {
    const label = l.kind === "exercice" ? "J'ai terminé cet exercice" : l.kind === "projet" ? "J'ai livré mon projet final" : "J'ai compris, marquer comme terminée";
    html += '<div class="finish" id="finish">' + (isDone(l.n)
      ? '<span class="state">Terminée</span><button class="btn ghost" type="button" id="undo">Annuler</button>'
      : '<button class="btn" type="button" id="mark">' + label + "</button>") + "</div>";
  }
  $("main").innerHTML = html;
  if (l.kind === "quiz") renderQuiz(l);
  else {
    const mark = $("mark"), undo = $("undo");
    if (mark) mark.onclick = () => {
      state.done[l.n] = true; save(); renderChrome();
      if (l.n === N) { toast("Dernière leçon terminée. Ton attestation est prête."); }
      else toast("Leçon " + l.n + " terminée");
      renderLesson(l);
    };
    if (undo) undo.onclick = () => { delete state.done[l.n]; save(); renderChrome(); renderLesson(l); };
  }
}

/* Quiz */
function renderQuiz(l) {
  const host = $("quizHost");
  const qs = l.questions;
  const best = state.quiz[l.n];
  let html = '<form class="quiz" id="quizForm" novalidate><p class="note" style="margin:0">Réponds aux ' + qs.length + " questions pour valider tes acquis. Il faut au moins " + PASS + " sur 100 pour valider le quiz.</p>";
  if (best) html += '<div><span class="badge">' + (best.passed ? "Validé" : "Déjà tenté") + " · meilleur score " + best.best + " / 100</span></div>";
  qs.forEach((q, i) => {
    html += '<fieldset class="q" data-i="' + i + '"><legend><span>Question ' + (i + 1) + " sur " + qs.length + "</span>" + inline(q.q) + '</legend><div class="opts">';
    q.o.forEach((o, j) => {
      html += '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '"><span class="ltr">' + "ABCD"[j] + "</span><span>" + inline(o) + "</span></label>";
    });
    html += '</div><p class="fb" hidden></p></fieldset>';
  });
  html += '<div id="resultHost" aria-live="polite"></div><div class="qbar"><button class="btn" type="submit" id="submitQ" disabled>Valider le quiz</button><span class="answered" id="answered">0 / ' + qs.length + " répondues</span></div></form>";
  host.innerHTML = html;
  const form = $("quizForm");
  const upd = () => {
    const n = qs.filter((_, i) => form.querySelector('input[name="q' + i + '"]:checked')).length;
    $("answered").textContent = n + " / " + qs.length + " répondues";
    $("submitQ").disabled = n < qs.length;
  };
  form.addEventListener("change", upd);
  form.addEventListener("submit", ev => {
    ev.preventDefault();
    let ok = 0;
    qs.forEach((q, i) => {
      const fs = form.querySelector('fieldset[data-i="' + i + '"]');
      const sel = form.querySelector('input[name="q' + i + '"]:checked');
      const val = sel ? parseInt(sel.value, 10) : -1;
      const opts = fs.querySelectorAll(".opt");
      opts.forEach((lab, j) => {
        lab.classList.add("locked");
        lab.querySelector("input").disabled = true;
        if (j === q.a) lab.classList.add("right");
        else if (j === val) lab.classList.add("wrong");
      });
      const fb = fs.querySelector(".fb");
      fb.hidden = false;
      if (val === q.a) { ok++; fb.className = "fb ok"; fb.textContent = "Bonne réponse."; }
      else { fb.className = "fb ko"; fb.textContent = "Réponse attendue : " + "ABCD"[q.a] + "."; }
    });
    const score = Math.round(ok / qs.length * 100);
    const passed = score >= PASS;
    const prev = state.quiz[l.n] || { best: 0, passed: false };
    state.quiz[l.n] = { best: Math.max(prev.best, score), passed: prev.passed || passed };
    if (passed) state.done[l.n] = true;
    save(); renderChrome();
    $("resultHost").innerHTML = '<div class="result ' + (passed ? "pass" : "fail") + '"><div class="score">' + score + '<small> / 100</small></div><p><strong>' +
      (passed ? "Quiz validé." : "Quiz non validé.") + "</strong> " + ok + " bonne" + (ok > 1 ? "s" : "") + " réponse" + (ok > 1 ? "s" : "") + " sur " + qs.length +
      ". " + (passed ? "Tu peux passer à la leçon suivante." : "Il faut au moins " + PASS + " sur 100. Relis les leçons du module puis refais le quiz.") + "</p></div>";
    $("submitQ").hidden = true; $("answered").hidden = true;
    const bar = form.querySelector(".qbar");
    const retry = document.createElement("button");
    retry.type = "button"; retry.className = "btn " + (passed ? "ghost" : ""); retry.textContent = "Refaire le quiz";
    retry.onclick = () => { renderQuiz(l); window.scrollTo(0, 0); };
    bar.appendChild(retry);
    if (l.n < N) {
      const nx = document.createElement("button");
      nx.type = "button"; nx.className = "btn"; nx.textContent = "Leçon suivante →"; nx.onclick = () => go(l.n + 1);
      if (passed) bar.appendChild(nx);
    }
    $("resultHost").scrollIntoView({ block: "center" });
  });
}

/* Attestation */
function quizAverage() {
  const ids = LESSONS.filter(l => l.kind === "quiz").map(l => l.n);
  const sc = ids.map(n => (state.quiz[n] || { best: 0 }).best);
  return { n: ids.length, avg: Math.round(sc.reduce((a, b) => a + b, 0) / (sc.length || 1)) };
}
function fmtDate(d) { try { return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return d; } }
function renderCert() {
  const main = $("main");
  const head = '<div class="eyebrow">Fin de parcours</div><h1>Attestation</h1>';
  if (!allDone()) {
    const quizzes = LESSONS.filter(l => l.kind === "quiz");
    const todo = LESSONS.filter(l => !isDone(l.n));
    main.innerHTML = head + '<p class="sub">L\'attestation se débloque quand les ' + N + " leçons sont terminées et que les quiz sont validés à " + PASS + " % ou plus.</p>" +
      '<div class="panel"><strong>Où tu en es</strong><ul><li>Leçons terminées : <b>' + doneCount() + " / " + N + "</b></li><li>Quiz validés : <b>" +
      quizzes.filter(q => isDone(q.n)).length + " / " + quizzes.length + "</b></li></ul>" +
      "<p style=\"margin:16px 0 6px\"><strong>Reste à faire</strong></p><ul>" + todo.map(l => '<li><button type="button" class="linkbtn" data-go="' + l.n + '">' + l.n + ". " + esc(l.title) + "</button>" + (l.kind === "quiz" ? '<span class="tag quiz">Quiz</span>' : "") + "</li>").join("") + "</ul></div>";
    main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(parseInt(b.dataset.go, 10)));
    return;
  }
  const qa = quizAverage();
  let html = head + '<p class="sub">Bravo, tu as terminé les ' + N + " leçons et validé les " + qa.n + " quiz.</p>";
  html += '<div class="field"><label for="nameIn">Ton nom complet</label><input id="nameIn" type="text" autocomplete="name" maxlength="60" placeholder="Prénom Nom" value="' + esc(state.name || "") + '"></div>';
  html += '<div class="cert-actions"><button class="btn" type="button" id="genCert">' + (state.certDate ? "Mettre à jour l'attestation" : "Générer l'attestation") + "</button></div>";
  html += '<div id="certHost"></div>';
  main.innerHTML = html;
  const draw = () => {
    if (!state.name || !state.certDate) { $("certHost").innerHTML = ""; return; }
    $("certHost").innerHTML = '<div class="cert" id="certBox"><div class="cert-in"><div class="kicker">Attestation de réussite</div><p>Cette attestation est décernée à</p><div class="who">' + esc(state.name) +
      '</div><p>pour avoir suivi les ' + N + ' leçons et validé les quiz de la formation</p><p class="course">E-commerce : lancer sa boutique en ligne et obtenir ses premières ventes</p>' +
      '<div class="meta"><span>' + N + " leçons terminées</span><span>" + qa.n + " quiz validés · moyenne " + qa.avg + " / 100</span><span>Le " + esc(fmtDate(state.certDate)) + "</span></div></div></div>" +
      '<div class="cert-actions"><button class="btn ghost" type="button" id="copyCert">Copier le texte</button></div><p class="note">Pour la garder, fais une capture d\'écran de l\'attestation.</p>';
    $("copyCert").onclick = () => {
      const t = "Attestation de réussite\n" + state.name + "\nA suivi les " + N + " leçons et validé les quiz de la formation « E-commerce : lancer sa boutique en ligne et obtenir ses premières ventes » (moyenne des quiz : " + qa.avg + " / 100).\nLe " + fmtDate(state.certDate);
      const fallback = () => { toast("Sélectionne le texte de l'attestation pour le copier."); };
      try { navigator.clipboard.writeText(t).then(() => toast("Texte copié"), fallback); } catch (e) { fallback(); }
    };
  };
  $("genCert").onclick = () => {
    const v = $("nameIn").value.trim();
    if (!v) { toast("Écris ton nom pour générer l'attestation."); $("nameIn").focus(); return; }
    state.name = v;
    if (!state.certDate) state.certDate = new Date().toISOString();
    save(); renderChrome(); draw();
    $("certBox").scrollIntoView({ block: "center" });
  };
  draw();
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id); toast.id = setTimeout(() => { t.hidden = true; }, 2600);
}
function closeMenu() { $("toc").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", "false"); }

/* Événements */
$("prev").onclick = () => go(current - 1);
$("next").onclick = () => go(current + 1);
$("menuBtn").onclick = () => { const o = $("toc").classList.toggle("open"); $("menuBtn").setAttribute("aria-expanded", o ? "true" : "false"); };
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-n]");
  if (b && (b.closest("#toc") || b.closest("#track"))) go(parseInt(b.dataset.n, 10));
});
window.addEventListener("hashchange", () => { const n = fromHash(); if (n !== current) go(n); });

current = fromHash();
render();
</script>

</body></html>

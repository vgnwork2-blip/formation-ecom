<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Formation E-commerce Débutant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: poste de travail de formation. En-tête fixe avec 21 segments de progression (un par leçon,
   groupés par module), sommaire à gauche sur grand écran, tiroir sur téléphone, barre précédent/suivant en bas. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #e9f0ee;
  --ink: #11201c;
  --muted: #52655f;
  --line: #d3dedb;
  --accent: #0a6a5a;
  --on-accent: #ffffff;
  --signal: #d98f00;
  --good: #19794a;
  --good-bg: #e0f3e8;
  --bad: #b3362a;
  --bad-bg: #fbe6e3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --hdr: 92px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1513; --surface: #14211e; --surface-2: #1b2c28; --ink: #e5eeeb; --muted: #94a9a2;
    --line: #273a35; --accent: #4cc9ad; --on-accent: #07211b; --signal: #f0b645;
    --good: #5fd495; --good-bg: #153326; --bad: #ff8b7d; --bad-bg: #3a1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1513; --surface: #14211e; --surface-2: #1b2c28; --ink: #e5eeeb; --muted: #94a9a2;
  --line: #273a35; --accent: #4cc9ad; --on-accent: #07211b; --signal: #f0b645;
  --good: #5fd495; --good-bg: #153326; --bad: #ff8b7d; --bad-bg: #3a1d1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: 4px; }

/* En-tête */
.hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.hdr-row { display: flex; align-items: center; gap: 12px; max-width: 1180px; margin: 0 auto; }
.brand { flex: 1; min-width: 0; }
.brand small { display: block; font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brand strong { display: block; font: 700 19px/1.2 var(--font-display); text-wrap: balance; margin-top: 4px; }
.count { font: 500 13px var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.track { display: flex; gap: 10px; max-width: 1180px; margin: 10px auto 0; }
.track .grp { display: flex; gap: 2px; flex: var(--w) 1 0; min-width: 0; }
.track button {
  flex: 1; height: 10px; padding: 0; border: 0; border-radius: 2px; background: var(--line); min-width: 0;
}
.track button.done { background: var(--accent); }
.track button.cur { background: var(--signal); }
.track button.cur.done { background: var(--signal); }
.track button:focus-visible { outline-offset: 1px; }

/* Structure */
.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; padding-block: 28px 110px; }
.toc { position: sticky; top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 16px); align-self: start;
  max-height: calc(100dvh - var(--hdr) - 96px); overflow-y: auto; padding-right: 6px; }
.toc h2 { font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.toc h2:first-child { margin-top: 0; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc li button {
  width: 100%; display: grid; grid-template-columns: 22px 28px minmax(0, 1fr); align-items: start; gap: 8px; text-align: left;
  background: transparent; border: 0; border-radius: 8px; padding: 7px 8px; font-size: 14px; line-height: 1.35; color: var(--ink);
}
.toc li button:hover { background: var(--surface-2); }
.toc li button[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; display: grid; place-items: center; }
.dot.done { background: var(--accent); border-color: var(--accent); }
.dot.done::after { content: ""; width: 5px; height: 9px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.dot.cur { border-color: var(--signal); }
.num { font: 500 12px/1.8 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font: 500 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; margin-left: 6px; color: var(--muted); vertical-align: 2px; }
.tag.quiz { color: var(--signal); border-color: var(--signal); }

/* Leçon */
main { min-width: 0; }
.eyebrow { font: 500 12px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(28px, 5vw, 42px)/1.12 var(--font-display); margin: 10px 0 10px; text-wrap: balance; letter-spacing: -.01em; }
.sub { font-size: 18px; color: var(--muted); margin: 0 0 8px; max-width: 62ch; }
.sec { margin-top: 30px; max-width: 68ch; }
.sec h2 { font: 700 22px/1.25 var(--font-display); margin: 0 0 10px; text-wrap: balance; }
.sec h3 { font: 700 17px/1.3 var(--font-display); margin: 18px 0 6px; }
.sec p { margin: 0 0 12px; }
.sec ul, .sec ol { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 6px; }
.sec li::marker { color: var(--accent); font-weight: 600; }
.sec ul ul { margin: 6px 0 0; }
.sec strong { font-weight: 600; }
.sec.task, .sec.key, .sec.check, .sec.example { padding: 18px 20px; border-radius: 12px; max-width: 72ch; }
.sec.task { background: var(--surface); border: 2px solid var(--accent); }
.sec.task h2::before { content: "À toi de jouer"; display: block; font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.sec.key { background: var(--surface-2); }
.sec.check { background: var(--surface); border: 1px solid var(--line); }
.sec.example { background: var(--surface); border: 1px solid var(--line); }
.sec.pitfalls li::marker { color: var(--bad); }
.sec > :last-child { margin-bottom: 0; }

/* Actions */
.finish { margin-top: 34px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.btn {
  border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; background: var(--accent); color: var(--on-accent); min-height: 44px;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.state { font-weight: 600; color: var(--good); display: inline-flex; align-items: center; gap: 8px; }
.state::before { content: ""; width: 9px; height: 16px; border: solid var(--good); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-2px, -2px); }

/* Quiz */
.quiz { margin-top: 24px; max-width: 72ch; display: grid; gap: 16px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 0; min-width: 0; }
.q legend { padding: 0; float: left; width: 100%; font-weight: 600; margin-bottom: 12px; }
.q legend span { font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.q .opts { clear: both; display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--bg); }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .ltr { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 500 12px var(--font-mono); color: var(--muted); background: var(--surface); }
.opt:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt:has(input:checked) .ltr { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt:has(input:focus-visible) { outline: 3px solid var(--signal); outline-offset: 2px; }
.opt.right { border-color: var(--good); background: var(--good-bg); box-shadow: none; }
.opt.right .ltr { background: var(--good); border-color: var(--good); color: var(--bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: none; }
.opt.wrong .ltr { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt.locked { cursor: default; }
.fb { margin: 10px 0 0; font-size: 14px; font-weight: 600; }
.fb.ok { color: var(--good); } .fb.ko { color: var(--bad); }
.qbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.answered { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.result { border-radius: 12px; padding: 20px; display: grid; gap: 6px; }
.result.pass { background: var(--good-bg); border: 2px solid var(--good); }
.result.fail { background: var(--bad-bg); border: 2px solid var(--bad); }
.result .score { font: 700 44px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.result .score small { font-size: 20px; color: var(--muted); font-weight: 500; }
.result p { margin: 0; }
.badge { display: inline-block; font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--good); border: 1px solid var(--good); border-radius: 999px; padding: 4px 10px; margin-top: 12px; }

/* Attestation */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; max-width: 72ch; margin-top: 22px; }
.panel ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.panel li { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: inherit; }
.field { display: grid; gap: 6px; margin-top: 18px; max-width: 420px; }
.field label { font-weight: 600; }
.field input { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 11px 12px; width: 100%; }
.cert {
  margin-top: 24px; max-width: 720px; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 8px;
}
.cert-in { border: 1px solid var(--line); padding: clamp(22px, 5vw, 48px); text-align: center; display: grid; gap: 14px; justify-items: center; }
.cert .kicker { font: 500 12px var(--font-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.cert h2 { font: 700 clamp(26px, 5vw, 38px)/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.cert .who { font: 700 clamp(28px, 6vw, 44px)/1.1 var(--font-display); color: var(--accent); border-bottom: 2px solid var(--signal); padding: 0 8px 6px; overflow-wrap: anywhere; }
.cert p { margin: 0; max-width: 46ch; }
.cert .course { font-weight: 600; font-size: 18px; }
.cert .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; font: 500 13px var(--font-mono); color: var(--muted); margin-top: 8px; }
.cert-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; align-items: center; }
.note { color: var(--muted); font-size: 14px; max-width: 60ch; }

/* Barre du bas */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 1180px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.bar .mid { font: 500 13px var(--font-mono); color: var(--muted); text-align: center; min-width: 0; font-variant-numeric: tabular-nums; }
.bar .btn { flex: 0 1 auto; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 40; max-width: calc(100% - 32px); }

@media (max-width: 900px) {
  :root { --hdr: 96px; }
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 20px; }
  .menu-btn { display: inline-block; }
  .toc { display: none; position: fixed; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; max-height: none; z-index: 15;
    background: var(--bg); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }
  .toc.open { display: block; }
  .brand strong { font-size: 17px; }
  .bar .btn span.t { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .track button, .opt, .btn { transition: background-color .15s, border-color .15s; }
}
</style>

<header class="hdr">
  <div class="hdr-row">
    <div class="brand"><small>Formation</small><strong>E-commerce : lancer sa boutique et obtenir ses premières ventes</strong></div>

</div>

<script>
const DATA = {"modules": [{"id": 1, "from": 1, "to": 6, "title": "Choisir sa niche et valider la rentabilité"}, {"id": 2, "from": 7, "to": 11, "title": "Construire une boutique prête à vendre"}, {"id": 3, "from": 12, "to": 16, "title": "Obtenir ses premiers visiteurs et piloter les résultats"}, {"id": 4, "from": 17, "to": 21, "title": "Preuves, portfolio et plan à 90 jours"}], "lessons": [{"n": 1, "title": "Introduction : E-commerce", "kind": "lesson", "min": 5, "md": "> Ce que tu vas apprendre, et comment ton parcours va se dérouler.\n\n## Bienvenue\n\nBravo d'avoir décidé de te lancer. Le e-commerce, c'est vendre des produits en ligne, et c'est une vraie façon de construire un business à toi. Ton objectif est clair : lancer une boutique prête à recevoir de vraies commandes ce mois-ci.\n\nTu débutes, et c'est très bien. Beaucoup de gens se trompent en achetant du stock ou en payant de la publicité trop tôt. Ici, on avance dans le bon ordre : d'abord réfléchir avec des chiffres, ensuite construire, puis attirer des visiteurs.\n\n## Ce que tu sauras faire\n\nÀ la fin du parcours, tu sauras concrètement :\n\n- Choisir une niche en analysant la demande, la concurrence et la marge possible, avant de dépenser quoi que ce soit.\n- Lancer une boutique fonctionnelle, avec des pages produits, un paiement sécurisé et des mentions légales.\n- Écrire des fiches produits qui rassurent et donnent envie d'acheter, avec de bonnes photos et de bons arguments.\n- Calculer ton prix de vente, ta marge, tes frais de livraison et ton seuil de rentabilité.\n- Attirer tes premiers visiteurs avec un canal simple, et suivre tes résultats.\n- Lire tes indicateurs pour savoir quoi corriger en premier.\n- Éviter les erreurs classiques du débutant et décider quand investir ou attendre.\n- Montrer des preuves de ton travail : ta boutique, ta première vente, ton tableau de bord.\n- Préparer tes 90 jours après le lancement, avec des objectifs mesurables.\n\n## Comment le parcours va se dérouler\n\nTu avances à ton rythme, avec environ vingt minutes par jour. C'est court, mais régulier, et c'est ce qui fait la différence.\n\nChaque module contient des leçons courtes. Après chaque leçon, tu fais un petit exercice pratique pour appliquer tout de suite. À la fin de chaque module, un quiz vérifie que tu as bien compris.\n\nÀ la fin du parcours, tu termines par un projet final. Si tu as validé les quiz et terminé toutes les leçons, tu reçois une attestation. Et surtout, tu repars avec une boutique réelle et une routine quotidienne que tu peux tenir.\n\n## Les mots à connaître\n\n- **Niche :** un petit segment de marché avec des clients précis qui ont un besoin précis.\n- **Marge :** ce qu'il te reste d'un produit vendu une fois ses coûts retirés.\n- **Fiche produit :** la page qui présente un article et doit convaincre de l'acheter.\n- **Taux de conversion :** la part des visiteurs qui finissent par acheter.\n- **Panier moyen :** la somme que dépense en moyenne un client à chaque commande.\n- **Seuil de rentabilité :** le moment où tes ventes couvrent enfin tous tes coûts.\n- **Acquisition :** toutes les façons d'amener des visiteurs vers ta boutique.\n\n## Ta première action\n\nPrends deux minutes, un papier ou une note sur ton téléphone. Écris trois produits ou thèmes qui t'intéressent, et pour chacun, la personne à qui tu pourrais le vendre. Pas besoin d'être sûr de toi. On va tester ces idées ensemble dans les prochaines leçons.\n\n## Points clés\n\n- Le e-commerce, c'est réfléchir avant de dépenser.\n- Une niche se choisit avec la demande, la concurrence et la marge.\n- Vingt minutes par jour, c'est suffisant si tu es régulier.\n- Les chiffres guident tes décisions, pas l'intuition.\n\n## Exemples\n\nQuand tu achètes un objet en ligne, observe ce qui t'a convaincu : la photo, la description, les avis ou la facilité de paiement.\n\n## Exercice\n\nNote sur papier ou dans ton téléphone trois idées de produits ou de thèmes qui t'intéressent. Pour chacune, écris en une phrase à qui tu pourrais la vendre.\n"}, {"n": 2, "title": "Les bases du e-commerce et les erreurs classiques du débutant", "kind": "lesson", "min": 30, "md": "> Panorama des modèles (stock, dropshipping, marque) et des pièges : mauvais fournisseur, stock excessif, dépenses aveugles.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon (20 minutes), vous saurez distinguer les trois grands modèles e-commerce (stock, dropshipping, marque propre), choisir celui qui convient à votre situation de débutant, et repérer les erreurs qui font perdre de l'argent avant la première vente. C'est la première étape pour choisir une niche rentable sans investir à l'aveugle et pour lancer une boutique prête à vendre ce mois-ci.\n\n## Pourquoi c'est utile pour votre objectif\n\nVotre but est de lancer une boutique et de réaliser une première vente rapidement, avec un budget maîtrisé. Le modèle choisi détermine votre trésorerie nécessaire, vos marges, vos délais de livraison et votre niveau de risque. Un mauvais choix dès le départ (stock trop gros, fournisseur peu fiable) peut bloquer le projet avant le lancement. Les modules suivants (niche, prix, fiches produits, acquisition) reposent sur cette décision.\n\n## Les trois modèles en bref\n\n### 1. Vente avec stock\n\nVous achetez les produits en quantité, les stockez et les expédiez vous-même. Avantages : marge plus élevée, contrôle de la qualité, livraison rapide. Inconvénients : trésorerie immobilisée, risque d'invendus, logistique à gérer.\n\n### 2. Dropshipping\n\nVous vendez des produits que le fournisseur expédie directement au client. Avantages : pas de stock, démarrage peu coûteux. Inconvénients : marges faibles, délais parfois longs, qualité peu contrôlée, forte concurrence, dépendance au fournisseur.\n\n### 3. Marque propre (ou produit différencié)\n\nVous faites fabriquer ou personnaliser un produit sous votre nom (ex. : impression à la demande, produit artisanal, assemblage de packs). Avantages : différenciation, meilleure marge, fidélisation. Inconvénients : plus de temps, d'investissement et de compétences.\n\n## Méthode pas à pas\n\n1. Fixez votre budget maximal de départ (par exemple la somme que vous accepteriez de perdre). Notez-le en une ligne.\n2. Évaluez votre temps : 20 minutes par jour limitent les modèles très lourds en logistique.\n3. Comparez les 3 modèles dans un tableau : investissement initial, marge estimée, délai de livraison, risque principal.\n4. Choisissez un modèle de départ : pour un débutant avec budget limité, le dropshipping avec fournisseur testé ou un petit stock (test de 10 à 30 unités) est souvent le plus réaliste.\n5. Vérifiez le fournisseur avant tout engagement : commandez un échantillon, vérifiez délais, qualité, politique de retour, coordonnées réelles, avis indépendants.\n6. Fixez une règle de stock : ne jamais commander plus que ce que vous pouvez vendre en 4 à 6 semaines tant que la demande n'est pas prouvée.\n7. Fixez une règle publicitaire : budget test plafonné, durée définie, indicateur de décision (coût par achat ou par ajout au panier) avant de dépenser.\n\n## Exemple concret\n\nUne personne veut vendre des accessoires pour animaux. Budget : 300 €. Option A : acheter 200 € de stock d'un seul produit non testé, ce qui laisse peu de marge pour la publicité. Option B : dropshipping avec un fournisseur qui livre en 5 à 8 jours, après commande d'un échantillon à 15 €. Elle choisit B pour valider la demande, puis passera à un petit stock sur le produit qui se vend, afin d'améliorer sa marge et ses délais.\n\n## Erreurs à éviter\n\n- **Mauvais fournisseur :** choisir uniquement sur le prix, sans échantillon ni vérification des délais et des retours.\n- **Stock excessif :** commander en gros pour obtenir un meilleur prix unitaire avant d'avoir une seule vente.\n- **Dépenses aveugles :** lancer des publicités sans budget plafond, sans suivi, sans hypothèse à tester.\n- **Promesses floues :** annoncer des délais ou des bénéfices que vous ne pouvez pas tenir, ce qui génère litiges et remboursements.\n- **Ignorer les frais cachés :** commissions de paiement, retours, emballage, taxes, publicité.\n- **Changer de produit sans cesse :** on ne peut rien mesurer si on ne laisse pas un test se terminer.\n\n## À faire maintenant\n\nCréez un tableau de décision (papier ou tableur) avec 3 colonnes (stock, dropshipping, marque propre) et 5 lignes : investissement initial, marge estimée, délai de livraison, risque principal, compatibilité avec 20 minutes par jour. Remplissez-le avec des estimations honnêtes, entourez le modèle retenu et ajoutez trois règles écrites : budget maximal, règle de stock, règle publicitaire.\n\n## Points clés\n\n- Le modèle (stock, dropshipping, marque) détermine trésorerie, marge, délais et risque : à choisir avant la niche et la boutique.\n- Un fournisseur se valide par un échantillon, des délais réels et une politique de retour, pas seulement par le prix.\n- Tant que la demande n'est pas prouvée, limiter le stock à ce qui se vend en 4 à 6 semaines.\n- Toute dépense publicitaire doit avoir un plafond, une durée et un indicateur de décision.\n- Avec 20 minutes par jour, privilégier un modèle simple à lancer et à suivre.\n\n## Exemples\n\n- Budget de 300 € : au lieu d'acheter 200 € de stock non testé, commander un échantillon à 15 € chez un fournisseur en dropshipping, vérifier qualité et délai de 5 à 8 jours, puis lancer un test avec un budget publicitaire plafonné à 50 €.\n- Une débutante passionnée de bougies commence par 20 unités d'un seul parfum (stock limité, marque propre), les vend en 3 semaines via les réseaux sociaux, puis recommande 50 unités uniquement après avoir mesuré la demande.\n\n## Exercice\n\n**Livrable :** un tableau de décision comparant stock, dropshipping et marque propre sur 5 critères (investissement initial, marge estimée, délai de livraison, risque principal, compatibilité avec 20 min/jour), plus 3 règles écrites (budget maximal, règle de stock, règle publicitaire).\n\n**Critères de réussite :** le modèle retenu est justifié en 2 phrases, tous les chiffres sont estimés et datés, le budget maximal est un montant précis, et la règle publicitaire contient un plafond, une durée et un indicateur de décision.\n"}, {"n": 3, "title": "Analyser la demande et la concurrence d'une niche", "kind": "lesson", "min": 30, "md": "> Méthode simple pour mesurer l'intérêt du marché, repérer les concurrents et trouver un angle différenciant.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon (20 minutes), vous saurez mesurer la demande d'une niche, repérer 5 concurrents directs et formuler un angle différenciant. C'est la première étape pour choisir une niche rentable sans dépenser un euro, et lancer une boutique prête à vendre ce mois-ci.\n\n## Pourquoi c'est utile pour votre objectif\n\nVotre objectif est de lancer une boutique avec de vraies commandes avant la fin du mois. Une niche sans demande ou saturée de concurrents gaspille votre temps et votre budget publicitaire. Cette analyse vous évite les erreurs classiques du débutant : produit choisi à l'intuition, promesse floue, dépenses aveugles. Elle alimente aussi le calcul de marge de la leçon suivante.\n\n## Méthode pas à pas\n\n1. **Listez 3 niches candidates.** Restez précis : « accessoires de randonnée pour enfants » plutôt que « sport ». Une niche = un public identifiable + un problème ou un désir clair.\n2. **Mesurez la demande avec Google Trends.** Comparez les mots-clés sur 12 mois et 5 ans en choisissant le pays cible. Cherchez une courbe stable ou en hausse, et méfiez-vous des pics ponctuels (effet de mode) ou de la forte saisonnalité.\n3. **Vérifiez les suggestions de recherche.** Tapez le mot-clé dans Google et notez les suggestions automatiques et les « Autres questions posées ». Elles révèlent ce que les gens veulent vraiment.\n4. **Écoutez le public.** Parcourez forums, groupes Facebook, Reddit, TikTok et Instagram. Notez 5 problèmes ou frustrations récurrents, avec les mots exacts utilisés par les clients.\n5. **Repérez 5 concurrents directs.** Tapez 3 requêtes d'achat sur Google et notez les boutiques des premiers résultats et des annonces Shopping. Pour chacun, relevez : fourchette de prix, promesse principale, qualité des photos, avis clients, livraison et retours.\n6. **Lisez les avis négatifs.** Les avis 1 à 3 étoiles (sur leur site, Trustpilot, Amazon) sont une mine : délais trop longs, qualité décevante, service client absent. Ce sont vos opportunités.\n7. **Trouvez votre angle différenciant.** Choisissez UN axe : public ultra-ciblé, qualité supérieure, livraison rapide, pack/kit, garantie forte, service ou contenu. Écrivez-le en une phrase : « Pour [public], [produit] qui [bénéfice], contrairement à [défaut des concurrents] ».\n8. **Attribuez un score.** Notez de 1 à 5 : demande, concurrence (5 = abordable), marge potentielle estimée, angle différenciant. Gardez la niche avec le meilleur total.\n\n## Exemple concret\n\nNiche testée : « gourdes isothermes pour enfants ». Google Trends montre une demande stable avec un pic en août-septembre (rentrée). Sur 5 concurrents, les prix vont de 14 à 29 €, et les avis négatifs citent surtout des fuites et des couvercles difficiles à nettoyer. Angle : « la gourde anti-fuite garantie 2 ans, facile à ouvrir pour les petites mains ». Score : demande 4, concurrence 3, marge 4, angle 4 = 15/20. Niche retenue pour la suite.\n\n## Erreurs à éviter\n\n- Choisir une niche trop large (« mode », « maison ») où vous serez noyé.\n- Confondre un pic de tendance avec une demande durable.\n- Croire que « beaucoup de concurrents » est mauvais : c'est souvent le signe d'un marché réel. Le problème, c'est l'absence d'angle.\n- Copier les concurrents sans différenciation, donc se battre uniquement sur le prix.\n- Ignorer la saisonnalité et la possibilité de livrer ou d'approvisionner le produit.\n\n## À faire maintenant\n\n**Livrable :** un tableau comparatif (tableur ou papier) avec 3 niches en lignes et, en colonnes : tendance Google Trends, 3 problèmes clients trouvés, 5 concurrents avec prix et faiblesse principale, angle en une phrase, score /20. Terminez par votre niche retenue et la justification en 2 lignes.\n\n## Points clés\n\n- Une niche se définit par un public précis et un problème clair, pas par une grande catégorie.\n- Google Trends sur 12 mois et 5 ans permet de distinguer demande durable, effet de mode et saisonnalité.\n- Les avis négatifs des concurrents révèlent les opportunités de différenciation.\n- La concurrence présente confirme souvent la demande ; il faut un angle clair pour y entrer.\n- Un score chiffré par niche remplace l'intuition par une décision comparable.\n\n## Exemples\n\n- Niche « gourdes isothermes enfants » : tendance stable avec pic à la rentrée, 5 concurrents entre 14 et 29 €, avis négatifs sur les fuites. Angle retenu : anti-fuite garantie 2 ans, ouverture facile. Score 15/20.\n- Niche « accessoires pour chat d'appartement » : forte demande, mais 5 concurrents généralistes aux fiches pauvres et livraison lente. Angle : kits d'enrichissement pour chats d'intérieur avec conseils d'usage et livraison sous 3 jours. Score 14/20, retenue en secours.\n\n## Exercice\n\nConstruisez votre tableau d'analyse de 3 niches (tendance Google Trends, 3 problèmes clients, 5 concurrents avec prix et faiblesse, angle en une phrase, score /20).\n\n**Critères de réussite :** chaque niche est précise (public + problème) ; au moins 5 concurrents sont documentés pour la niche favorite ; l'angle tient en une phrase mentionnant public, bénéfice et défaut des concurrents ; la niche finale est choisie avec un score justifié, sans aucun budget engagé.\n"}, {"n": 4, "title": "Calculer prix, marges, livraison et seuil de rentabilité", "kind": "lesson", "min": 30, "md": "> Construire un tableau de calcul : coût d'achat, frais de livraison, commissions de paiement, marge nette et point mort.\n\n## Objectifs pratiques\n\nDans cette leçon de 20 minutes, vous allez construire un tableau de calcul qui vous dit, pour un produit précis, à quel prix le vendre, combien vous gagnez réellement par commande et combien de ventes il faut pour couvrir vos frais. C'est l'étape qui valide (ou invalide) votre niche avant d'investir le moindre euro.\n\n## Pourquoi c'est utile pour votre objectif\n\nVotre objectif est de choisir une niche rentable et de piloter la boutique avec des chiffres fiables plutôt qu'à l'intuition. Beaucoup de débutants voient une marge de 50 % sur le papier, puis découvrent que la livraison, les commissions de paiement, les retours et la publicité la ramènent à presque zéro. Avec un tableau, vous éliminez les produits non rentables en 10 minutes, avant de créer la boutique.\n\n## Méthode pas à pas\n\n1. Listez le coût d'achat unitaire (HT) : prix fournisseur, plus frais d'import ou de personnalisation éventuels, plus emballage.\n2. Ajoutez les frais de livraison réels : coût d'expédition payé par vous (transporteur ou fournisseur). Si vous facturez la livraison au client, comptez-la comme un revenu séparé.\n3. Fixez un prix de vente TTC test, puis convertissez en HT. En France, avec une TVA à 20 % : prix HT = prix TTC / 1,2. Si vous êtes en franchise en base de TVA, vérifiez les règles applicables à votre situation.\n4. Déduisez les commissions de paiement : un ordre de grandeur courant est autour de 1,5 à 3 % + un montant fixe par transaction (environ 0,25 à 0,30 €). Vérifiez les tarifs actuels de votre solution de paiement et de votre plateforme.\n5. Prévoyez une provision pour retours et casse : 3 à 5 % du prix de vente pour démarrer.\n6. Calculez la marge brute unitaire : prix de vente HT − coût d'achat − livraison − commissions − provision retours.\n7. Ajoutez le coût d'acquisition (CAC) cible : combien pouvez-vous dépenser en publicité ou en outils pour obtenir une vente ? La marge nette = marge brute − CAC.\n8. Calculez le seuil de rentabilité : frais fixes mensuels (abonnement boutique, domaine, outils, comptable éventuel) / marge unitaire = nombre de ventes minimum par mois.\n9. Faites un test de stress : baissez le prix de 10 % et augmentez les coûts de livraison de 15 %. Si la marge disparaît, le produit est trop fragile.\n\n## Exemple concret\n\nProduit : une gourde isotherme personnalisable. Coût d'achat 8 €, emballage 0,50 €, livraison payée 4,50 €. Prix de vente TTC 29,90 €, soit 24,92 € HT (TVA 20 %). Commission de paiement estimée : 3 % + 0,25 € ≈ 1,00 €. Provision retours 4 % ≈ 1,00 €.\n\nMarge brute = 24,92 − 8 − 0,50 − 4,50 − 1,00 − 1,00 = 9,92 € (≈ 40 %).\n\nSi le CAC est de 8 €, la marge nette tombe à 1,92 € par vente : trop fragile. Avec des frais fixes de 60 €/mois, le seuil de rentabilité est de 60 / 9,92 ≈ 7 ventes sans publicité, mais 32 ventes avec un CAC de 8 €. Décision : relever le prix à 34,90 €, négocier le coût d'achat, ou privilégier un canal gratuit (réseaux sociaux, SEO) pour démarrer.\n\n## Erreurs à éviter\n\n- Confondre marge et marge nette : oublier les commissions, retours et publicité.\n- Calculer avec des prix TTC et des coûts HT mélangés.\n- Sous-estimer la livraison (poids volumétrique, emballage, envois à l'international).\n- Oublier les frais fixes dans le seuil de rentabilité.\n- Se fier à une estimation unique : testez toujours un scénario pessimiste.\n- Ne pas vérifier les tarifs réels de votre plateforme et de votre prestataire de paiement.\n\n## À faire maintenant\n\nCréez un tableur (Google Sheets ou Excel) avec une ligne par produit candidat et ces colonnes : coût d'achat, emballage, livraison, prix TTC, prix HT, commission paiement, provision retours, marge brute, CAC cible, marge nette, frais fixes, seuil de rentabilité. Remplissez-le pour 3 produits de votre niche et marquez en vert celui qui reste rentable après le test de stress.\n\n## Points clés\n\n- La marge réelle = prix HT − achat − emballage − livraison − commissions − retours − acquisition.\n- Toujours raisonner en HT pour comparer prix de vente et coûts.\n- Seuil de rentabilité = frais fixes mensuels / marge unitaire.\n- Un test de stress (prix −10 %, livraison +15 %) révèle les produits fragiles.\n- Le CAC cible doit rester nettement inférieur à la marge brute unitaire.\n\n## Exemples\n\n- Gourde personnalisée : prix 29,90 € TTC, marge brute ≈ 9,92 €, mais marge nette ≈ 1,92 € avec 8 € de CAC. En passant à 34,90 € TTC, la marge brute monte à environ 13,9 €, ce qui rend le test publicitaire viable.\n- Accessoire léger (support de téléphone) : achat 3 €, livraison en lettre suivie 2,50 €, prix 19,90 € TTC (16,58 € HT). Marge brute ≈ 7,6 € après commissions et retours. Avec 60 € de frais fixes, il faut environ 8 ventes par mois pour être à l'équilibre, hors publicité.\n\n## Exercice\n\nConstruisez votre tableau de rentabilité pour 3 produits de votre niche.\n\n**Critères de réussite :** (1) chaque ligne contient tous les postes de coût, y compris commissions et provision retours ; (2) prix et coûts sont comparés en HT ; (3) le seuil de rentabilité est calculé avec vos frais fixes réels ; (4) un scénario de stress est appliqué ; (5) vous désignez un produit retenu avec une marge nette positive et une justification en 2 phrases.\n"}, {"n": 5, "title": "Fiche de validation de 3 niches candidates", "kind": "exercice", "min": 35, "md": "> Comparer trois niches sur la demande, la concurrence et la marge, puis choisir celle à lancer.\n\n## Objectif pratique\n\nDans cet exercice, tu vas construire une fiche de validation comparant 3 niches e-commerce candidates, puis choisir celle à lancer, sans dépenser un euro. Durée estimée : 4 sessions de 20 minutes (80 minutes au total), réparties sur 4 jours.\n\n## Pourquoi cet exercice t'aide\n\nTon objectif est d'ouvrir une boutique prête à vendre ce mois-ci, avec des chiffres fiables plutôt qu'à l'intuition. Choisir la niche est la décision la plus coûteuse à corriger plus tard. Une mauvaise niche, c'est un mauvais fournisseur, un stock invendable et des publicités gaspillées, soit les erreurs classiques du débutant. Cette fiche te donne une décision argumentée et un premier élément de ton portfolio de preuves.\n\n## Méthode pas à pas\n\n### Étape 1 : lister 3 niches (session 1, 20 min)\n\nChoisis 3 niches précises, pas des catégories larges. Exemple : « accessoires de randonnée pour chiens » plutôt que « animaux ». Pour chaque niche, note le client cible et le problème résolu.\n\n### Étape 2 : mesurer la demande (session 2, 20 min)\n\nPour chaque niche, relève 3 à 5 mots-clés dans Google Trends (tendance sur 5 ans, stable, en hausse ou saisonnière). Relève aussi les suggestions Google et le volume estimé avec un outil gratuit. Vérifie l'activité sur TikTok, Instagram ou Reddit (nombre de publications, engagement). Attribue une note de 1 à 5.\n\n### Étape 3 : analyser la concurrence (session 3, 20 min)\n\nRepère 5 concurrents par niche. Note leurs prix, leur positionnement, leurs avis clients et leur promesse. Cherche les angles faibles : livraison lente, photos médiocres, avis négatifs récurrents. Une concurrence présente est bon signe (le marché existe), mais il faut un angle différenciant. Attribue une note de 1 à 5.\n\n### Étape 4 : estimer la marge et décider (session 4, 20 min)\n\nPour 1 produit phare par niche, estime : prix de vente TTC, prix d'achat fournisseur (devis ou prix de gros indicatif), frais de livraison, frais de paiement (environ 1,5 à 3 % + frais fixes), coût d'acquisition estimé. Calcule la marge brute en € et en %, puis le seuil de rentabilité (frais fixes mensuels ÷ marge unitaire). Vise une marge brute d'au moins 40 à 50 % et un panier supérieur à 30 €. Remplis le tableau final avec des notes pondérées : demande 30 %, concurrence 30 %, marge 40 %.\n\n## Exemple concret\n\nNiche A « bouteilles isothermes personnalisées » : prix de vente 29 €, achat 9 €, livraison 4 €, frais de paiement 1,2 €. Marge brute = 29 − 9 − 4 − 1,2 = 14,8 € (51 %). Avec 100 € de frais fixes mensuels, le seuil est d'environ 7 ventes. Demande 4/5, concurrence 3/5, marge 4/5.\n\n## Erreurs à éviter\n\n- Choisir une niche par passion sans vérifier la demande.\n- Oublier la livraison, les retours ou les frais de paiement dans la marge.\n- Se fier à un seul outil ou à une seule source.\n- Choisir un produit fragile, réglementé ou à très faible marge.\n- Confondre tendance passagère et demande durable.\n\n## Livrables attendus\n\n- Un tableau (Google Sheets ou Excel) avec les 3 niches, les notes et les chiffres de marge.\n- Une liste de 5 concurrents par niche avec leurs liens.\n- Une décision écrite de 5 lignes : niche retenue, 3 raisons chiffrées, 1 risque principal et comment le limiter.\n\n## Critères de réussite\n\n- 3 niches précises comparées avec les mêmes critères.\n- Au moins 2 sources de demande par niche.\n- Marge calculée en € et en % avec tous les coûts, et seuil de rentabilité indiqué.\n- Un angle de différenciation clair pour la niche choisie.\n- Décision justifiée par les chiffres, sans budget engagé.\n\n## Points clés\n\n- Choisir une niche précise et non une catégorie large\n- Valider la demande avec au moins 2 sources indépendantes\n- Analyser 5 concurrents par niche pour trouver un angle différenciant\n- Calculer la marge en incluant livraison, frais de paiement et acquisition\n- Viser une marge brute d'au moins 40 à 50 %\n- Décider avec une grille pondérée avant tout investissement\n\n## Exemples\n\n- Niche « bouteilles isothermes personnalisées » : prix 29 €, coût total 14,2 €, marge 14,8 € (51 %), seuil de rentabilité d'environ 7 ventes pour 100 € de frais fixes.\n- Grille pondérée : demande 4/5 × 30 % + concurrence 3/5 × 30 % + marge 4/5 × 40 % = 3,7/5.\n\n## Exercice\n\nCrée un tableau comparant 3 niches précises sur la demande (Google Trends et réseaux sociaux), la concurrence (5 concurrents chacune) et la marge d'un produit phare (prix, achat, livraison, frais de paiement, seuil de rentabilité). Note chaque niche avec une grille pondérée, puis rédige une décision de 5 lignes qui justifie la niche choisie par des chiffres et un risque principal.\n"}, {"n": 6, "title": "Niche, marges et pièges du débutant", "kind": "quiz", "min": 0, "sub": "Vérifier la compréhension des critères de choix de niche et des calculs de rentabilité.", "questions": [{"q": "Pour un débutant avec un budget limité et 20 minutes par jour, quelle approche est présentée comme la plus réaliste pour démarrer ?", "o": ["Acheter un gros stock pour obtenir un meilleur prix unitaire", "Le dropshipping avec un fournisseur testé ou un petit stock de test de 10 à 30 unités", "Lancer immédiatement une marque propre avec fabrication sur mesure", "Choisir le modèle le moins cher sans comparer les risques"], "a": 1}, {"q": "Comment la leçon recommande-t-elle de valider un fournisseur avant de s'engager ?", "o": ["Se fier uniquement au prix le plus bas", "Commander un échantillon et vérifier délais, qualité, politique de retour et coordonnées réelles", "Choisir celui qui propose le plus gros stock", "Se baser sur le nombre de publications sur les réseaux sociaux"], "a": 1}, {"q": "Dans l'analyse de la demande avec Google Trends, quel signal doit vous inciter à la prudence ?", "o": ["Une courbe stable sur 12 mois et 5 ans", "Une courbe en hausse régulière sur plusieurs années", "Un pic ponctuel ou une forte saisonnalité", "La présence de suggestions de recherche liées au mot-clé"], "a": 2}, {"q": "Pourquoi lire les avis négatifs (1 à 3 étoiles) des concurrents lors de l'analyse d'une niche ?", "o": ["Pour copier leurs descriptions produits", "Pour repérer leurs défauts récurrents (délais, qualité, service) qui deviennent des opportunités de différenciation", "Pour décider de ne jamais entrer sur un marché concurrentiel", "Pour estimer leur chiffre d'affaires exact"], "a": 1}, {"q": "Un produit coûte 8 € à l'achat, avec 0,50 € d'emballage et 4,50 € de livraison payée. Il est vendu 29,90 € TTC (24,92 € HT avec 20 % de TVA). Quelle est la bonne méthode pour obtenir la marge brute unitaire ?", "o": ["29,90 € − 8 €, car la TVA et la livraison ne comptent pas", "Prix de vente HT − coût d'achat − emballage − livraison − commissions de paiement − provision retours", "Prix de vente TTC − coût d'achat uniquement", "Coût d'achat × 2 − prix de vente TTC"], "a": 1}, {"q": "Comment calcule-t-on le seuil de rentabilité mensuel d'une boutique ?", "o": ["Marge unitaire ÷ frais fixes mensuels", "Frais fixes mensuels ÷ marge unitaire", "Prix de vente TTC × nombre de visiteurs", "Coût d'achat × stock commandé"], "a": 1}, {"q": "À quoi sert le test de stress (prix −10 %, coûts de livraison +15 %) dans le calcul de rentabilité ?", "o": ["À fixer le prix définitif de vente", "À vérifier si la marge reste positive malgré des conditions moins favorables, et repérer les produits fragiles", "À calculer la TVA applicable", "À comparer deux fournisseurs entre eux"], "a": 1}]}, {"n": 7, "title": "Choisir sa plateforme et configurer sa boutique", "kind": "lesson", "min": 35, "md": "> Comparer les solutions courantes, paramétrer la boutique, la navigation et les pages essentielles.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon (20 minutes), vous aurez choisi une plateforme e-commerce adaptée à votre situation et posé la structure de base de votre boutique : réglages, navigation et pages essentielles. C'est l'étape qui vous rapproche d'une boutique prête à recevoir de vraies commandes ce mois-ci, sans perdre de temps dans des comparatifs sans fin.\n\n## Pourquoi c'est utile pour votre objectif\n\nVotre échéance est courte : lancer ce mois-ci. Une mauvaise plateforme coûte du temps (migration), de l'argent (abonnements et commissions cachés) et des ventes (paiement peu fiable, site lent). Une configuration propre dès le départ vous permet ensuite de vous concentrer sur les fiches produits, le calcul des marges et l'acquisition de trafic.\n\n## Méthode pas à pas\n\n1. Listez vos besoins réels : nombre de produits prévus (5 ou 500), type de vente (produits physiques, dropshipping, numériques), pays de vente, budget mensuel maximal pour les outils.\n2. Comparez 3 solutions courantes sur les mêmes critères :\n   - **Shopify :** très simple, nombreuses applications, abonnement mensuel plus commission si vous n'utilisez pas Shopify Payments. Idéal pour démarrer vite.\n   - **WooCommerce (WordPress) :** logiciel gratuit, mais hébergement, maintenance et sécurité à gérer. Flexible, demande plus de technique.\n   - **Wix, PrestaShop ou autres :** à considérer si vous les connaissez déjà ou si un besoin précis l'impose.\n3. Vérifiez 5 critères : coût total sur 12 mois (abonnement + apps + frais de transaction), facilité de prise en main, moyens de paiement sécurisés (carte, PayPal), thèmes adaptés au mobile, possibilité de gérer TVA, livraison et mentions légales.\n4. Décidez en 10 minutes maximum : pour un débutant pressé, choisissez la solution la plus simple à prendre en main, avec une période d'essai.\n5. Configurez les réglages de base : nom de la boutique, adresse e-mail professionnelle, devise, pays, taxes, zones et tarifs de livraison, passerelle de paiement.\n6. Construisez une navigation simple : un menu principal à 3-5 entrées (Boutique ou Catégories, À propos, Contact, FAQ), un pied de page pour les pages légales.\n7. Créez les pages essentielles : accueil, catégorie, fiche produit, À propos, Contact, FAQ, Livraison et retours, CGV, mentions légales, politique de confidentialité.\n8. Passez une commande test : vérifiez le parcours complet (panier, paiement, e-mail de confirmation) sur mobile et ordinateur.\n\n## Exemple concret\n\nUne débutante veut vendre 8 accessoires pour animaux. Budget outils : 40 €/mois. Elle compare Shopify (essai, abonnement mensuel, thème mobile prêt) et WooCommerce (hébergement à choisir, extensions à installer). Elle choisit Shopify car elle veut lancer en 2 semaines. Elle crée 4 catégories, un menu à 4 entrées, règle la livraison (tarif fixe, gratuite au-dessus d'un seuil), active le paiement par carte et PayPal, puis rédige les pages légales à partir de modèles adaptés à son pays, à faire relire. Elle fait une commande test avec un code de réduction à 100 % et découvre qu'un e-mail de confirmation affiche encore le nom par défaut : corrigé avant le lancement.\n\n## Erreurs à éviter\n\n- Passer des jours à comparer au lieu de décider : une plateforme « suffisante » vaut mieux qu'une plateforme parfaite.\n- Ignorer les coûts cachés : applications payantes, commissions, domaine, thème premium.\n- Menu surchargé : un visiteur doit trouver un produit en 2 clics.\n- Oublier les pages légales et de livraison/retours, qui rassurent et sont obligatoires.\n- Publier sans commande test.\n\n## À faire maintenant\n\n**Livrable :** un tableau comparatif de 2 à 3 plateformes (coût sur 12 mois, facilité, paiement, mobile, légal) avec votre choix final et sa justification en 2 lignes. Puis créez votre compte d'essai et la checklist de configuration (réglages, menu, 10 pages essentielles) avec le statut de chaque élément (fait / à faire).\n\n## Points clés\n\n- Choisissez la plateforme selon le coût total sur 12 mois, la simplicité et la sécurité du paiement, pas selon la popularité seule.\n- Un menu de 3 à 5 entrées suffit pour qu'un visiteur trouve un produit en 2 clics.\n- Les pages livraison, retours, CGV, mentions légales et confidentialité sont indispensables avant la première vente.\n- Une commande test complète sur mobile et ordinateur évite les mauvaises surprises au lancement.\n- Limitez la décision à 10 minutes pour tenir l'échéance de lancement du mois.\n\n## Exemples\n\n- **Scénario Shopify :** 8 produits, budget outils 40 €/mois, lancement en 2 semaines. Choix d'une solution clé en main avec essai, thème mobile, paiement carte et PayPal activés, 4 catégories et un menu à 4 entrées.\n- **Scénario WooCommerce :** une personne à l'aise avec WordPress veut garder le contrôle et éviter l'abonnement. Elle prévoit hébergement, certificat SSL, extensions de paiement et sauvegardes, et compte le temps de maintenance dans son coût total.\n- **Commande test :** un code de réduction à 100 % permet de vérifier panier, paiement, e-mail de confirmation et calcul des frais de livraison sans dépenser d'argent.\n\n## Exercice\n\nCréez en 20 minutes : (1) un tableau comparant 2 à 3 plateformes sur 5 critères (coût sur 12 mois, facilité, paiement sécurisé, mobile, gestion légale/TVA) ; (2) votre choix justifié en 2 lignes ; (3) une checklist de 10 pages et réglages avec statut.\n\n**Critères de réussite :** décision prise, compte d'essai créé, menu de 3 à 5 entrées défini, liste des pages légales complète, commande test planifiée.\n"}, {"n": 8, "title": "Paiement sécurisé, livraison et mentions légales", "kind": "lesson", "min": 35, "md": "> Configurer le paiement, les options de livraison, CGV, politique de retour et mentions légales obligatoires.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon (environ 20 minutes), vous aurez configuré les trois piliers qui permettent à votre boutique de recevoir de vraies commandes ce mois-ci : un paiement sécurisé, des options de livraison claires et les documents légaux obligatoires (mentions légales, CGV, politique de retour). Chaque élément vous rapproche du lancement et rassure le visiteur hésitant.\n\n## Pourquoi c'est utile pour votre objectif\n\nUne belle fiche produit ne suffit pas : sans paiement fiable, sans frais de livraison visibles et sans informations légales, le visiteur quitte la page au moment de payer. Ces réglages réduisent l'abandon de panier. Ils vous protègent aussi en cas de litige. Enfin, ils alimentent votre portfolio de preuves : une boutique complète et conforme est plus crédible qu'une vitrine inachevée.\n\n## Méthode pas à pas\n\n1. **Activer le paiement sécurisé.** Dans votre plateforme (Shopify, WooCommerce, etc.), activez une passerelle de paiement reconnue (Stripe, PayPal ou la solution intégrée). Complétez la vérification d'identité et le compte bancaire. Vérifiez que le site est en HTTPS (cadenas dans le navigateur). Proposez carte bancaire plus une alternative (PayPal, Apple Pay).\n2. **Faire un paiement test.** Passez une commande réelle de faible montant, ou utilisez le mode test. Contrôlez l'e-mail de confirmation, le montant, la TVA et les frais affichés.\n3. **Définir les zones et tarifs de livraison.** Calculez le coût réel (emballage + transporteur + délai). Choisissez : livraison offerte à partir d'un seuil de panier, tarif forfaitaire ou tarif au poids. Intégrez ce coût dans vos marges avant de fixer le seuil.\n4. **Afficher les délais.** Indiquez un délai de préparation et de livraison réaliste, sur la fiche produit et au panier. Mieux vaut annoncer 5 à 7 jours et livrer en 4 que l'inverse.\n5. **Rédiger la politique de retour.** Précisez : délai de rétractation (14 jours minimum pour un consommateur dans l'UE), qui paie le retour, mode de remboursement et exceptions (produits personnalisés, hygiène). Rédigez en phrases courtes.\n6. **Rédiger les CGV.** Elles couvrent : identité du vendeur, prix TTC, modes de paiement, livraison, droit de rétractation, garanties légales, médiation de la consommation et loi applicable. Utilisez un modèle fourni par votre plateforme, puis adaptez-le à votre activité réelle.\n7. **Publier les mentions légales.** Indiquez : nom ou raison sociale, statut juridique, adresse, e-mail de contact, numéro SIRET (ou équivalent), numéro de TVA si applicable, hébergeur du site, directeur de publication. Ajoutez une politique de confidentialité et le bandeau cookies si vous utilisez des outils de mesure.\n8. **Rendre le tout visible.** Placez les liens dans le pied de page, et un lien vers livraison et retours près du bouton d'achat.\n\n## Exemple concret\n\nUne boutique de bougies artisanales vend à 24 € TTC. Coût produit 7 €, emballage 1,20 €, expédition 4,90 €. En proposant la livraison offerte dès 45 €, le panier moyen passe de 24 à environ 40 € grâce à l'ajout d'un second produit. Le texte de retour, visible sous le bouton « Ajouter au panier », indique : « Retour sous 14 jours, remboursement sous 5 jours après réception ». Le visiteur sait à quoi s'attendre et l'abandon de panier baisse.\n\n## Erreurs à éviter\n\n- Copier les CGV d'un concurrent sans les adapter : elles peuvent être fausses pour votre cas.\n- Cacher les frais de livraison jusqu'à la dernière étape : c'est l'une des premières causes d'abandon.\n- Promettre des délais irréalistes avec un fournisseur lointain.\n- Oublier les informations légales de l'entreprise (SIRET, adresse) ou le lien de médiation.\n- Ne pas tester le parcours de commande sur mobile.\n- Ne pas intégrer le coût de livraison et les frais de paiement dans le calcul de marge.\n\n*Note : cette leçon est pédagogique et ne remplace pas un avis juridique. Vérifiez les règles de votre pays et de votre statut.*\n\n## À faire maintenant\n\nCréez un document « Checklist de lancement » contenant : (1) la passerelle de paiement activée et le résultat de votre commande test, (2) un tableau de livraison (zone, transporteur, coût réel, tarif client, délai), (3) vos pages CGV, retours et mentions légales publiées avec leurs liens. Prenez des captures d'écran pour votre portfolio de preuves.\n\n## Points clés\n\n- Un paiement sécurisé (HTTPS, passerelle reconnue, alternative de paiement) se valide par une commande test réelle.\n- Les frais et délais de livraison doivent être visibles avant le paiement et intégrés dans le calcul de marge.\n- La politique de retour claire (14 jours minimum de rétractation dans l'UE) rassure et réduit les hésitations.\n- CGV, mentions légales et politique de confidentialité sont obligatoires et doivent être adaptées à votre activité.\n- Ces pages se placent en pied de page et près du bouton d'achat pour être faciles à trouver.\n\n## Exemples\n\n- Boutique de bougies à 24 € TTC : coût total par commande 13,10 € (produit 7 €, emballage 1,20 €, expédition 4,90 €). Livraison offerte dès 45 € pour encourager un second produit et monter le panier moyen vers 40 €.\n- Boutique d'accessoires de téléphone : un texte sous le bouton d'achat annonce « Expédié sous 48 h, livré en 4 à 6 jours, retour gratuit sous 14 jours ». Le test sur mobile révèle un bouton PayPal caché, corrigé avant le lancement.\n\n## Exercice\n\n**Livrable :** une checklist de lancement en 3 parties.\n\n1. **Paiement :** activez une passerelle, passez une commande test et capturez l'e-mail de confirmation.\n2. **Livraison :** remplissez un tableau (zone, transporteur, coût réel, prix client, délai) avec au moins une option.\n3. **Légal :** publiez CGV, politique de retour et mentions légales, avec liens dans le pied de page.\n\n**Critères de réussite :** le paiement test aboutit sans erreur ; les frais de livraison s'affichent avant la dernière étape ; les mentions légales contiennent identité, adresse, contact et SIRET ; le parcours fonctionne sur mobile ; vous avez 3 captures d'écran pour votre portfolio.\n"}, {"n": 9, "title": "Rédiger des fiches produits qui convertissent", "kind": "lesson", "min": 35, "md": "> Structurer titre, bénéfices, arguments de vente, réponses aux objections et choix des photos.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon (20 minutes), vous saurez écrire une fiche produit complète : un titre clair, des bénéfices, des arguments de vente, des réponses aux objections et un choix de photos. C'est l'étape qui rend votre boutique prête à vendre ce mois-ci. Un visiteur hésitant ne peut ni toucher ni essayer le produit, donc la fiche doit faire ce travail à sa place.\n\n## Pourquoi c'est utile pour votre objectif\n\nVous construisez une boutique capable de recevoir de vraies commandes. Une fiche faible gaspille tout le trafic que vous obtiendrez plus tard (réseaux sociaux, SEO, pub test). Améliorer la fiche augmente le taux de conversion, donc le nombre de ventes pour le même budget. Elle sert aussi de preuve dans votre portfolio : une boutique avec des fiches soignées montre que vous gérez un projet de bout en bout.\n\n## Méthode pas à pas\n\n1. **Définissez l'acheteur et son problème.** Écrivez en une phrase : « Pour [qui], qui veut [résultat], malgré [frein] ».\n2. **Rédigez le titre.** Format : produit + usage ou bénéfice principal + différenciateur. Exemple : « Gourde isotherme 750 ml – 24 h de fraîcheur, sans fuite ». Évitez les titres vagues ou bourrés de mots-clés.\n3. **Transformez les caractéristiques en bénéfices.** Pour chaque caractéristique, demandez-vous « et alors ? ». « Double paroi inox » donne « votre eau reste glacée toute la journée de travail ».\n4. **Rédigez 3 à 5 puces d'arguments.** Une idée par puce, avec un chiffre ou un fait vérifiable (matière, dimensions, poids, garantie).\n5. **Listez les objections et répondez-y.** Les plus courantes sont : « Est-ce de bonne qualité ? », « Quand vais-je recevoir ma commande ? », « Puis-je retourner le produit ? », « Taille ou compatibilité ? ». Placez les réponses près du bouton d'achat : livraison, retours, paiement sécurisé, contact.\n6. **Choisissez les photos.** Prévoyez au minimum 5 images : produit sur fond clair, produit en usage, détail de matière, échelle ou dimensions, emballage ou contenu du colis. La première image doit être nette et lisible sur mobile.\n7. **Ajoutez un appel à l'action clair.** Un seul bouton visible, avec un texte du type « Ajouter au panier ». Placez prix, délai de livraison et réassurance juste à côté.\n8. **Relisez sur mobile.** Vérifiez si une personne comprend le produit et le prix en 5 secondes.\n\n## Exemple concret\n\nProduit : une gourde isotherme vendue à des sportifs amateurs.\n\n**Avant :** « Gourde inox 750 ml, double paroi, couleur noire. »\n\n**Après :** « Gourde isotherme 750 ml – eau fraîche 24 h, zéro fuite dans le sac de sport ». Puces : « Garde le froid 24 h, le chaud 12 h », « Bouchon étanche : glissez-la dans votre sac sans crainte », « Inox sans BPA, lavable au lave-vaisselle ». Réponses aux objections : « Livraison en 3 à 5 jours ouvrés », « Retour sous 14 jours », « Paiement sécurisé ».\n\nLa seconde version parle du résultat pour l'acheteur et lève les doutes avant la question.\n\n## Erreurs à éviter\n\n- Copier le texte du fournisseur : il est générique, et ce texte dupliqué peut nuire à votre référencement.\n- Promettre des résultats flous ou exagérés (« la meilleure du monde »). Restez précis et vérifiable.\n- Écrire un bloc de texte compact sans puces ni sous-titres.\n- Mettre des photos sombres, de mauvaise qualité ou une seule image.\n- Cacher livraison, retours et coordonnées en bas de page.\n\n## À faire maintenant\n\n**Livrable :** une fiche produit complète pour votre produit principal. Rédigez dans un document : 1 phrase acheteur/problème, 1 titre, 3 à 5 puces de bénéfices, 3 réponses aux objections (livraison, retour, qualité), et une liste de 5 photos à réaliser. Publiez-la dans votre boutique, puis testez-la sur mobile avec une personne extérieure pendant 5 secondes.\n\n## Points clés\n\n- Un titre efficace combine produit, bénéfice et différenciateur\n- Chaque caractéristique doit être traduite en bénéfice concret pour l'acheteur\n- Les réponses aux objections (livraison, retours, qualité, paiement) se placent près du bouton d'achat\n- Au moins 5 photos variées, dont une en usage, lisibles sur mobile\n- Ne jamais copier le texte du fournisseur : rédigez un texte original et précis\n\n## Exemples\n\n- **Gourde isotherme :** le titre passe de « Gourde inox 750 ml noire » à « Gourde isotherme 750 ml – eau fraîche 24 h, sans fuite ». Les puces expliquent le froid 24 h, le bouchon étanche et l'inox sans BPA, ce qui répond au doute sur la qualité.\n- **Bougie artisanale :** au lieu de « bougie parfumée 200 g », la fiche indique « environ 45 h de combustion, cire de soja, idéale pour un salon de 20 m² ». Elle précise le délai d'expédition (48 h) et le retour sous 14 jours, et montre 5 photos : fond clair, allumée dans un salon, mèche, dimensions avec une main, emballage cadeau.\n\n## Exercice\n\nRédigez et publiez la fiche de votre produit principal avec : 1 titre bénéfice, 3 à 5 puces, 3 réponses aux objections, 5 photos.\n\n**Critères de réussite :** chaque caractéristique est traduite en bénéfice ; le texte est original et sans promesse exagérée ; livraison, retours et paiement sécurisé sont visibles près du bouton ; la fiche est lisible sur mobile ; une personne extérieure comprend le produit et son prix en 5 secondes.\n"}, {"n": 10, "title": "Publier 3 fiches produits complètes", "kind": "exercice", "min": 45, "md": "> Créer trois fiches avec photos, description persuasive et prix cohérent avec les calculs de marge.\n\n## Objectif pratique\n\nÀ la fin de cet exercice, tu auras publié 3 fiches produits complètes dans ta boutique : photos, titre, description persuasive, prix cohérent avec ta marge, et informations de livraison et de retour. Durée estimée : 4 sessions de 20 minutes (environ 80 minutes au total), à étaler sur 4 jours.\n\n## Pourquoi cet exercice t'aide\n\nTon objectif est d'ouvrir une boutique prête à recevoir de vraies commandes ce mois-ci. Une fiche produit est la page où un visiteur hésitant décide d'acheter ou de partir. En publiant trois fiches reliées à tes calculs de marge, tu avances sur trois objectifs à la fois : des fiches persuasives, des prix fiables, et un premier élément de portfolio visible.\n\n## Prérequis\n\n- Une boutique créée (Shopify, WooCommerce, PrestaShop, Wix ou autre) avec le paiement activé en mode test ou réel.\n- Une niche choisie et 3 produits sélectionnés (idéalement un produit d'appel, un produit principal et un produit complémentaire).\n- Un tableur avec, pour chaque produit : coût d'achat, frais de livraison, frais de paiement (environ 1,5 à 3 % + frais fixes), coût d'emballage.\n\n## Méthode pas à pas\n\n### Étape 1 : calculer le prix (20 min)\n\nPour chaque produit, calcule : coût de revient = achat + livraison entrante + emballage + frais de paiement. Prix de vente = coût de revient / (1 - marge visée). Vise une marge brute d'au moins 40 à 50 % pour absorber la publicité. Compare avec 3 concurrents directs. Note aussi le seuil de rentabilité : frais fixes mensuels / marge unitaire.\n\n### Étape 2 : produire les photos (20 min)\n\nPrévois 4 images minimum par produit : photo principale sur fond clair, photo de détail, photo en situation d'usage, photo d'échelle ou de taille. Lumière naturelle près d'une fenêtre, format carré ou 4:5 cohérent, image compressée (moins de 300 Ko) et texte alternatif décrivant l'image (utile pour le SEO).\n\n### Étape 3 : rédiger la fiche (20 min par lot)\n\nStructure chaque fiche ainsi :\n\n- Titre clair : produit + bénéfice + cible.\n- Accroche d'une phrase sur le problème résolu.\n- 3 à 5 puces bénéfices (bénéfice d'abord, caractéristique ensuite).\n- Détails techniques : dimensions, matière, poids, entretien.\n- Livraison, délai, retours et garantie, avec des promesses précises et vérifiables.\n- Bouton d'achat visible, avec réassurance (paiement sécurisé, contact).\n\n### Étape 4 : vérifier et publier (20 min)\n\nPasse chaque fiche sur mobile, passe une commande test, vérifie la cohérence prix/TVA/livraison et la présence des liens vers les CGV, mentions légales et politique de retour.\n\n## Exemple concret\n\nProduit : gourde isotherme 750 ml. Coût d'achat 7 €, livraison 1,50 €, emballage 0,50 €, frais de paiement 0,90 €. Coût de revient 9,90 €. Pour 50 % de marge, prix = 19,80 €, arrondi à 19,90 €. Titre : « Gourde isotherme 750 ml – 24 h de fraîcheur pour le sport et le bureau ». Puces : garde le froid 24 h, ne goutte pas, passe au lave-vaisselle.\n\n## Erreurs à éviter\n\n- Copier-coller la description du fournisseur (mauvais pour le SEO et peu crédible).\n- Promesses floues (« qualité premium ») sans preuve.\n- Fixer un prix sans calculer la marge après publicité et frais de paiement.\n- Oublier délais de livraison et conditions de retour.\n- Photos sombres ou de tailles différentes.\n\n## Livrables attendus\n\n- 3 fiches produits publiées avec leurs URL.\n- Un tableur de marges avec les 3 produits.\n- Une capture d'écran de chaque fiche en version mobile.\n- Une capture de commande test réussie.\n\n## Critères de réussite\n\n- Chaque fiche contient au moins 4 photos, un titre, 3 puces bénéfices et des détails techniques.\n- Marge brute calculée et supérieure ou égale à 40 % pour chaque produit.\n- Délai de livraison, retours et réassurance visibles.\n- Commande test fonctionnelle et affichage correct sur mobile.\n\n## Action immédiate\n\nOuvre ton tableur maintenant et calcule le prix du premier produit. C'est la tâche des 20 prochaines minutes.\n\n## Points clés\n\n- Un prix se déduit du coût de revient complet et de la marge visée, jamais de l'intuition\n- Une fiche performante : bénéfices d'abord, caractéristiques ensuite, réassurance visible\n- Au moins 4 photos cohérentes par produit, compressées et avec texte alternatif\n- Tester la fiche sur mobile et via une commande test avant de communiquer\n- Les captures et le tableur alimentent ton portfolio de preuves\n\n## Exemples\n\n- Gourde 750 ml : coût de revient 9,90 €, marge 50 %, prix 19,90 €, titre orienté bénéfice et cible.\n- Puce bénéfice : « Ne goutte pas dans ton sac » plutôt que « joint silicone ».\n\n## Exercice\n\nPublie 3 fiches produits complètes (4 photos, titre, accroche, 3 à 5 puces bénéfices, détails, livraison et retours) avec un prix issu de ton calcul de marge (≥ 40 %). Livre les 3 URL, ton tableur de marges, des captures mobiles et une capture de commande test réussie.\n"}, {"n": 11, "title": "Checklist de lancement de la boutique", "kind": "quiz", "min": 0, "sub": "Contrôler les points indispensables avant de recevoir de vraies commandes.", "questions": [{"q": "Pour choisir une plateforme e-commerce, quel critère faut-il comparer en priorité selon la leçon ?", "o": ["La popularité de la plateforme sur les réseaux sociaux", "Le coût total sur 12 mois (abonnement, applications, frais de transaction), la simplicité et la sécurité du paiement", "Le nombre de thèmes graphiques disponibles uniquement", "Le fait que la plateforme soit la plus récente du marché"], "a": 1}, {"q": "Avant de considérer que le paiement de la boutique est prêt, quelle vérification est recommandée ?", "o": ["Passer une commande test complète et contrôler l'e-mail de confirmation, le montant, la TVA et les frais", "Vérifier uniquement que le logo apparaît dans le panier", "Attendre la première vraie commande d'un client pour voir si cela fonctionne", "Désactiver le HTTPS pour accélérer le chargement des pages"], "a": 0}, {"q": "Pourquoi les frais de livraison doivent-ils être calculés avant de fixer un seuil de livraison offerte ?", "o": ["Parce que la livraison n'a aucun impact sur la rentabilité", "Parce que le coût réel (emballage + transporteur) doit être intégré dans la marge pour ne pas vendre à perte", "Parce que les clients ne regardent jamais les frais de port", "Parce que la loi interdit d'afficher les frais avant le paiement"], "a": 1}, {"q": "Quel est le délai de rétractation minimum à mentionner dans la politique de retour pour un consommateur dans l'UE ?", "o": ["48 heures", "7 jours", "14 jours", "90 jours"], "a": 2}, {"q": "Dans une fiche produit, comment transformer la caractéristique « double paroi inox » en bénéfice ?", "o": ["« Double paroi inox, couleur noire »", "« Gourde de qualité supérieure à prix imbattable »", "« Votre eau reste glacée toute la journée de travail »", "« Produit disponible en plusieurs tailles »"], "a": 2}, {"q": "Où faut-il placer les réponses aux objections (livraison, retours, paiement sécurisé) sur une fiche produit ?", "o": ["Uniquement dans les CGV en bas du site", "Près du bouton d'achat, avec le prix et le délai de livraison", "Dans un e-mail envoyé après la commande", "Sur la page À propos uniquement"], "a": 1}]}, {"n": 12, "title": "Choisir un canal d'acquisition simple", "kind": "lesson", "min": 35, "md": "> Réseaux sociaux, SEO de base ou publicité test : critères de choix selon budget et niche.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon (20 minutes), vous aurez choisi UN canal d'acquisition pour votre boutique, avec un budget de test et un critère de réussite chiffré. C'est l'étape qui relie votre boutique prête à vendre à vos premiers visiteurs qualifiés, et donc à votre première vente ce mois-ci.\n\n## Pourquoi c'est utile pour votre objectif\n\nUn débutant qui s'éparpille sur Instagram, TikTok, Google et Facebook Ads n'obtient aucun résultat mesurable. Avec 20 minutes par jour et une échéance courte, la seule stratégie viable est de concentrer l'effort sur un canal pendant 2 à 4 semaines. Cela évite aussi les dépenses publicitaires aveugles, une erreur classique du débutant, et vous permet de lire vos indicateurs (trafic, conversion) sans bruit.\n\n## Les trois canaux simples\n\n### Réseaux sociaux organiques\n\nCoût en argent : quasi nul. Coût en temps : élevé. Résultats : 2 à 8 semaines. Adapté si votre produit est visuel, démontrable en vidéo courte, ou émotionnel (déco, mode, accessoires, animaux). Le trafic est souvent froid : beaucoup de vues, peu d'achats au début.\n\n### SEO de base\n\nCoût en argent : faible. Résultats : 3 à 6 mois. Adapté si les gens cherchent déjà précisément votre produit sur Google (ex. « gourde isotherme 1 litre »). Trop lent pour un objectif de première vente ce mois-ci, mais utile à préparer en parallèle (titres, descriptions) sans y consacrer votre temps principal.\n\n### Publicité test (Meta, TikTok, Google Shopping)\n\nCoût en argent : réel. Résultats : en quelques jours. Adapté si votre marge est suffisante et si vous acceptez de perdre un petit budget pour apprendre. Il faut une fiche produit solide et un suivi de base, sinon l'argent est gaspillé.\n\n## Méthode pas à pas\n\n1. Fixez votre budget d'apprentissage : combien pouvez-vous perdre sans stress ? Ex. 0 €, 50 € ou 150 €.\n2. Évaluez votre marge unitaire : si elle est inférieure à 10-15 €, la pub payante sera très difficile à rentabiliser.\n3. Notez comment votre client cherche ou découvre : il tape une requête précise (SEO), il scrolle et se laisse séduire (réseaux, pub) ?\n4. Notez chaque canal de 1 à 5 sur trois critères : budget compatible, adéquation produit, rapidité des résultats. Additionnez.\n5. Choisissez le meilleur score et un seul canal. Le second reste en veille.\n6. Définissez un test de 14 jours : fréquence d'action (ex. 1 vidéo par jour, ou 5 €/jour), et un seuil de réussite (ex. 300 visiteurs, 1 % de conversion ou 3 ajouts au panier).\n7. Installez le suivi : lien avec paramètres UTM ou, au minimum, un relevé quotidien des visites et commandes par source.\n\n## Exemple concret\n\nUne boutique d'accessoires pour chiens, marge de 12 € par produit, budget de 0 €, 20 min/jour. Scores : réseaux sociaux 13/15 (produit visuel, gratuit), SEO 8/15 (trop lent), pub 6/15 (marge trop faible, budget nul). Décision : TikTok/Instagram Reels, 1 vidéo de 15 secondes par jour pendant 14 jours, objectif de 300 visites vers la boutique et 3 ajouts au panier. Si l'objectif n'est pas atteint, on modifie l'accroche des vidéos avant de changer de canal.\n\n## Erreurs à éviter\n\n- Tester trois canaux en même temps et ne rien pouvoir conclure.\n- Lancer de la publicité sans avoir calculé la marge ni le coût d'acquisition maximal acceptable.\n- Abandonner un canal après 3 jours : donnez-lui au moins 14 jours.\n- Mesurer les vues plutôt que les clics et les ajouts au panier.\n- Choisir le canal à la mode plutôt que celui où se trouve votre client.\n\n## À faire maintenant\n\nRemplissez un tableau à 3 lignes (réseaux, SEO, pub) et 3 colonnes de notes, puis rédigez votre décision en une phrase : canal, budget, durée, fréquence, seuil de réussite. Gardez-le : il alimentera votre tableau de bord dans la prochaine leçon.\n\n## Points clés\n\n- Un seul canal à la fois pendant 14 jours minimum pour obtenir des données exploitables\n- Le choix dépend de trois critères : budget, adéquation avec le produit et rapidité des résultats\n- La publicité payante exige une marge unitaire suffisante et une fiche produit déjà solide\n- Le SEO est un investissement à 3-6 mois : à préparer, pas à attendre pour la première vente\n- Définir avant le test un seuil de réussite chiffré évite de décider à l'intuition\n\n## Exemples\n\n- Boutique d'accessoires pour chiens, marge 12 €, budget 0 € : scores réseaux 13/15, SEO 8/15, pub 6/15. Choix : 1 Reel par jour pendant 14 jours, objectif 300 visites et 3 ajouts au panier.\n- Boutique de gourdes isothermes, marge 18 €, budget test 100 € : le client cherche des requêtes précises, donc publicité Google Shopping à 5 €/jour pendant 20 jours. Coût d'acquisition maximal accepté : 12 €, soit sous la marge. Arrêt si 150 clics n'ont donné aucun ajout au panier.\n\n## Exercice\n\nCréez votre tableau de décision des 3 canaux (réseaux sociaux, SEO de base, publicité test) noté de 1 à 5 sur budget, adéquation produit et rapidité. Puis rédigez votre plan de test de 14 jours en une phrase.\n\n**Critères de réussite :** un seul canal retenu ; budget maximal indiqué en euros ; fréquence d'action réaliste dans 20 min/jour ; au moins un seuil chiffré (visites, ajouts au panier ou ventes) ; marge unitaire citée pour justifier le choix.\n"}, {"n": 13, "title": "Lancer un test d'acquisition à petit budget", "kind": "lesson", "min": 35, "md": "> Définir une cible, un message, un budget plafonné et un critère d'arrêt pour éviter les dépenses aveugles.\n\n## Objectifs pratiques\n\nÀ la fin de cette leçon (20 minutes), vous aurez un test d'acquisition prêt à lancer : une cible précise, un message unique, un budget plafonné et un critère d'arrêt écrit. C'est l'étape qui vous fait passer de « boutique prête » à « premiers visiteurs qualifiés », sans brûler votre budget à l'aveugle.\n\n## Pourquoi c'est utile pour votre objectif\n\nVotre objectif est d'obtenir des visiteurs qualifiés ce mois-ci et d'éviter les dépenses publicitaires aveugles. Un test cadré vous donne des données fiables (clics, ajouts au panier, ventes) pour décider : continuer, corriger ou arrêter. Sans cadre, on dépense, on ne comprend rien et on abandonne. Avec un cadre, même un test à 0 vente vous apprend quelque chose.\n\n## Méthode pas à pas\n\n1. **Choisir un seul canal.** Un débutant se concentre sur un canal : publicité test (Meta, TikTok), publication organique sur un réseau social ou SEO de base. Choisissez celui où se trouve déjà votre cible.\n2. **Définir la cible en une phrase.** Qui, quel problème, quel contexte. Exemple : « Femmes de 25-40 ans qui courent le matin et cherchent une ceinture de running confortable ».\n3. **Écrire une promesse unique et vérifiable.** Un bénéfice concret, pas un slogan flou. Ex. : « Téléphone et clés sécurisés, zéro rebond en courant ».\n4. **Créer 2 variantes maximum.** Même cible, deux visuels ou deux accroches. Plus de variantes dilue le budget et les données.\n5. **Fixer le budget plafonné.** Calculez votre marge unitaire (voir module précédent). Règle simple : budget test = 2 à 3 fois la marge d'une vente × 10 à 15, ou une somme que vous acceptez de perdre. Ex. : 5 €/jour pendant 7 jours = 35 €.\n6. **Écrire le critère d'arrêt avant de lancer.** Deux seuils : un seuil de coupure (ex. : 100 clics sans aucun ajout au panier, on arrête et on change le message) et un seuil de réussite (ex. : coût par achat inférieur à la marge unitaire, on continue).\n7. **Poser le suivi.** Une ligne par jour : dépense, impressions, clics, visiteurs, ajouts au panier, commandes. Utilisez des liens avec paramètres UTM si possible.\n8. **Lancer, ne rien toucher 48 h,** puis décider selon vos critères, pas selon votre humeur.\n\n## Exemple concret\n\nBoutique de ceintures de running, prix 29 €, marge brute après livraison et frais de paiement : 12 €. Cible : coureuses débutantes 25-40 ans. Promesse : « Ne tenez plus votre téléphone en courant ». Budget : 5 €/jour pendant 7 jours = 35 €. Critères : arrêt si 100 clics sans ajout au panier ; succès si on obtient au moins 3 ventes (coût par achat ≈ 11,6 €, sous la marge de 12 €). Résultat jour 4 : 90 clics, 6 ajouts au panier, 1 vente. On continue jusqu'à jour 7, puis on teste une seconde accroche.\n\n## Erreurs à éviter\n\n- Lancer sans connaître sa marge : impossible de savoir si le coût par achat est acceptable.\n- Cibler « tout le monde » : clics chers et peu qualifiés.\n- Modifier la pub toutes les heures : les données deviennent inexploitables.\n- Augmenter le budget après un seul coup de chance.\n- Juger uniquement les clics : un clic ne paie pas, regardez ajout au panier et achat.\n- Envoyer le trafic vers la page d'accueil au lieu de la fiche produit concernée.\n\n## À faire maintenant\n\nRemplissez une fiche « Plan de test » d'une page : canal, cible en une phrase, promesse, 2 variantes, budget total et durée, seuil d'arrêt, seuil de réussite, tableau de suivi quotidien (dépense, clics, ajouts au panier, commandes). Planifiez le lancement dans votre agenda sous 48 h.\n\n## Points clés\n\n- Un test = une cible, un message, un budget plafonné, un critère d'arrêt écrit avant le lancement\n- Le budget se déduit de la marge unitaire, pas de l'intuition\n- Limiter à un canal et 2 variantes pour obtenir des données lisibles\n- Décider selon les seuils (ajout au panier, coût par achat), pas selon les clics seuls\n- Un test sans vente reste utile s'il indique quoi corriger\n\n## Exemples\n\n- Ceintures de running à 29 € (marge 12 €) : 5 €/jour pendant 7 jours = 35 €. Arrêt si 100 clics sans ajout au panier ; succès si coût par achat < 12 €.\n- Boutique de bougies artisanales via Instagram organique : 3 publications/semaine ciblant des offres cadeaux, 2 accroches testées, suivi des visites vers la fiche produit pendant 14 jours. Critère : moins de 20 visites après 2 semaines, on change de format ou de cible.\n\n## Exercice\n\nRédigez votre fiche Plan de test sur une page.\n\n**Critères de réussite :** (1) la cib
